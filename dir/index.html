<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LKA | Repository Directory</title>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --panel-bg: #111;
            --text-main: #e0e0e0;
            --qc-cyan: #3df5f5;
            --qc-yellow: #fde89c;
            --border-color: #333;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Consolas', 'Courier New', monospace;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .header {
            border-left: 4px solid var(--qc-cyan);
            padding-left: 15px;
            margin-bottom: 30px;
        }

        h1 { margin: 0; font-size: 24px; letter-spacing: 2px; color: var(--qc-cyan); }
        p { margin: 5px 0 0 0; color: #888; font-size: 12px; text-transform: uppercase; }

        .search-box {
            width: 100%;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-family: inherit;
            font-size: 16px;
            padding: 15px;
            box-sizing: border-box;
            margin-bottom: 20px;
            outline: none;
        }

        .search-box:focus {
            border-color: var(--qc-cyan);
        }

        .directory-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .repo-link {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 15px 20px;
            text-decoration: none;
            color: var(--text-main);
            transition: 0.2s;
        }

        .repo-link:hover {
            border-color: var(--qc-cyan);
            background: #1a1a1a;
            transform: translateX(5px);
        }

        .repo-name {
            font-size: 16px;
            font-weight: bold;
        }

        .repo-url {
            font-size: 12px;
            color: #666;
        }

        .repo-link:hover .repo-url {
            color: var(--qc-yellow);
        }

        .hidden {
            display: none !important;
        }

        .stats {
            margin-top: 20px;
            font-size: 12px;
            color: var(--qc-cyan);
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>LKA REPOSITORY INDEX</h1>
            <p>GITHUB MASTER DIRECTORY</p>
        </div>

        <input type="text" id="searchInput" class="search-box" placeholder="FILTER REPOSITORIES..." autocomplete="off">

        <div class="directory-list" id="directoryList">
            </div>
        
        <div class="stats" id="statsDisplay">SYSTEM READY</div>
    </div>

<script>
        // =========================================================================
        // 1. DATA: Each repo MUST be on a new line to be parsed correctly
        // =========================================================================
        const rawPDFText = `
ARMike-2
ARMike
black
blackline
blackline2
blacky
box
calendar
card
cleader
clock
clock2.
clock2
cofp
converter
dashboard
deconverter
demo
drawn
dxf2wline
ez
finger
gcoder
hdc
index_backup
jsontowally
leader
link-2
links
lka_export
logo-2
logo
ltutcws
manual
mfHAL
minibook
mir
mirror-2
mirror
movies
orion
pmapper
promo
qc-hor
qc
rotate
router
s2-2
s2
scale
sftg
sftg2
sfts
sig
sqf
stair-e
stair-studio
stair
studio
table
test-2
test-4
test-5
test
third
trailer
trans-rot
traverse
triplets
truss
tst
ucf
vault
vector
w2dxf
wally-store
web
white
wib
wib2
wib3`;

        // Your specific GitHub path
        const defaultGitHubUser = "https://github.com/btlsp2000/wally-v1/"; 

        // =========================================================================
        // 2. PARSER & RENDER ENGINE
        // =========================================================================
        const directoryList = document.getElementById('directoryList');
        const searchInput = document.getElementById('searchInput');
        let linkElements = [];

        function buildDirectory() {
            // Clear existing list if any
            directoryList.innerHTML = '';
            linkElements = [];

            // Split into lines, trim spaces, and remove empty lines
            const lines = rawPDFText.split('\n').map(line => line.trim()).filter(line => line.length > 0);
            
            lines.forEach(line => {
                let url;
                let displayName = line;

                if (line.toLowerCase().startsWith('http')) {
                    url = line;
                    const parts = line.split('/');
                    displayName = parts[parts.length - 1] || parts[parts.length - 2]; 
                } else {
                    // Append the repo name to your base GitHub URL
                    url = `${defaultGitHubUser}${line}`;
                }

                const a = document.createElement('a');
                a.href = url;
                a.target = "_blank";
                a.className = "repo-link";
                a.innerHTML = `
                    <span class="repo-name">${displayName}</span>
                    <span class="repo-url">${url}</span>
                `;

                directoryList.appendChild(a);
                linkElements.push({ element: a, text: displayName.toLowerCase() });
            });

            document.getElementById('statsDisplay').innerText = `INDEXED: ${linkElements.length} REPOSITORIES`;
        }

        // =========================================================================
        // 3. LIVE FILTERING
        // =========================================================================
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            let visibleCount = 0;

            linkElements.forEach(item => {
                if (item.text.includes(query)) {
                    item.element.classList.remove('hidden');
                    visibleCount++;
                } else {
                    item.element.classList.add('hidden');
                }
            });

            document.getElementById('statsDisplay').innerText = `SHOWING: ${visibleCount} / ${linkElements.length} REPOSITORIES`;
        });

        // Initialize the build
        buildDirectory();
    </script>
</body>
</html>
