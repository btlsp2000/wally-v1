<!DOCTYPE html>
<html>
<head>
    <title>WallyCAD - Elliptical Taper Gen</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #121212; color: #0f0; padding: 15px; }
        .panel { max-width: 450px; margin: auto; border: 1px solid #333; padding: 20px; background: #1a1a1a; }
        .row { display: flex; justify-content: space-between; margin-bottom: 10px; }
        input { background: #000; color: #0f0; border: 1px solid #0f0; width: 60px; text-align: center; }
        textarea { width: 100%; height: 250px; background: #000; color: #fff; border: 1px solid #444; margin-top: 10px; font-size: 11px; }
        button { width: 100%; background: #0f0; color: #000; border: none; padding: 12px; cursor: pointer; font-weight: bold; }
        h2 { border-bottom: 1px solid #0f0; font-size: 14px; margin-top: 0; }
    </style>
</head>
<body>

<div class="panel">
    <h2>ELLIPTICAL TAPER GEN</h2>
    <div class="row"><span>Major Axis (A):</span> <input type="number" id="major" value="100"></div>
    <div class="row"><span>Minor Axis (B):</span> <input type="number" id="minor" value="60"></div>
    <div class="row"><span>Stair Width (w):</span> <input type="number" id="width" value="30"></div>
    <div class="row"><span>Treads (N):</span> <input type="number" id="N" value="8"></div>
    <div class="row"><span>Start Angle:</span> <input type="number" id="start" value="0"></div>
    <div class="row"><span>End Angle:</span> <input type="number" id="end" value="90"></div>
    
    <button onclick="genElliptical()">GENERATE TAPERED TREADS</button>
    <textarea id="output" readonly placeholder="Coordinate Blobs..."></textarea>
</div>

<script>
    function getEllipticalPoint(a, b, thetaDeg) {
        const rad = thetaDeg * (Math.PI / 180);
        return {
            x: a * Math.cos(rad),
            y: b * Math.sin(rad)
        };
    }

    function genElliptical() {
        const A = parseFloat(document.getElementById('major').value);
        const B = parseFloat(document.getElementById('minor').value);
        const W = parseFloat(document.getElementById('width').value);
        const N = parseInt(document.getElementById('N').value);
        const start = parseFloat(document.getElementById('start').value);
        const end = parseFloat(document.getElementById('end').value);

        const step = (end - start) / N;
        let finalOutput = "";

        for (let i = 0; i < N; i++) {
            let s1 = start + (i * step);
            let s2 = start + ((i + 1) * step);

            // Inner Ellipse (Radius - Width/2)
            let p1 = getEllipticalPoint(A - W/2, B - W/2, s1);
            let p2 = getEllipticalPoint(A - W/2, B - W/2, s2);
            
            // Outer Ellipse (Radius + Width/2)
            let p3 = getEllipticalPoint(A + W/2, B + W/2, s2);
            let p4 = getEllipticalPoint(A + W/2, B + W/2, s1);

            let block = "";
            block += `${p1.x.toFixed(2)} ${p1.y.toFixed(2)}\n`;
            block += `${p2.x.toFixed(2)} ${p2.y.toFixed(2)}\n`;
            block += `${p3.x.toFixed(2)} ${p3.y.toFixed(2)}\n`;
            block += `${p4.x.toFixed(2)} ${p4.y.toFixed(2)}\n`;
            block += `${p1.x.toFixed(2)} ${p1.y.toFixed(2)}\n\n`; // Closed Loop + Delimiter

            finalOutput += block;
        }
        document.getElementById('output').value = finalOutput.trim();
    }
</script>
</body>
</html>
