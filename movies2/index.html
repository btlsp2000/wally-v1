<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Digital Library</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --accent: #00ff41; /* Updated to match WallyCAD/HDC terminal green */
            --godzilla-red: #ff4d4d;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
        }
        header {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        h1 {
            margin: 0;
            font-weight: 300;
            letter-spacing: 1px;
        }
        #movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 24px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .movie-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            border: 1px solid #333;
        }
        .movie-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
            border-color: var(--accent);
        }
        .poster-image {
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            border-bottom: 2px solid var(--accent);
        }
        .poster-placeholder {
            width: 100%;
            aspect-ratio: 2 / 3;
            background-color: #2a2a2a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.9em;
            color: var(--text-muted);
            border-bottom: 2px solid var(--accent);
            text-align: center;
            padding: 10px;
        }
        .movie-info {
            padding: 16px;
        }
        .movie-title {
            margin: 0 0 8px 0;
            font-size: 1.1em;
            color: var(--text-main);
        }
        .platform-badge {
            display: inline-block;
            font-size: 0.75em;
            padding: 4px 8px;
            border-radius: 4px;
            background-color: #333;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        /* Custom style for the WallyCAD feature */
        .featured-card {
            border: 1px solid var(--godzilla-red);
        }
    </style>
</head>
<body>
    <header>
        <h1>MY MOVIES</h1>
    </header>
    <main id="movie-grid"></main>

    <script>
        const inventory = [
            {
                title: "WallyCAD Minus One",
                platform: "HDC Portal",
                url: "https://wallycad.com/movies",
                poster: "gozillap.jpg", // Reference to the design style in gozillap.jpg
                isFeatured: true
            },
            {
                title: "Heat",
                platform: "YouTube",
                url: "https://www.youtube.com/watch?v=YOUR_VIDEO_ID",
                poster: ""
            },
            {
                title: "No Country for Old Men",
                platform: "Prime",
                url: "https://www.amazon.com/gp/video/detail/YOUR_ID",
                poster: ""
            }
        ];

        const grid = document.getElementById('movie-grid');

        inventory.forEach(movie => {
            const card = document.createElement('a');
            card.href = movie.url;
            card.target = "_blank";
            card.className = `movie-card ${movie.isFeatured ? 'featured-card' : ''}`;

            // If a poster image is available (like gozillap.jpg), use it; otherwise use the placeholder
            const posterContent = movie.poster 
                ? `<img src="${movie.poster}" alt="${movie.title}" class="poster-image">`
                : `<div class="poster-placeholder">
                    <span style="font-size: 0.7em; color: var(--accent);">WALLYCAD ENGINE</span><br>
                    Drafting Space
                   </div>`;

            card.innerHTML = `
                ${posterContent}
                <div class="movie-info">
                    <h2 class="movie-title">${movie.title}</h2>
                    <span class="platform-badge">${movie.platform}</span>
                </div>
            `;

            grid.appendChild(card);
        });
    </script>
</body>
</html>
