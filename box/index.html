<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wally-Box | Dual-line & Hatch Gen</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #121212; color: #0f0; padding: 15px; }
        .panel { max-width: 450px; margin: auto; border: 1px solid #333; padding: 20px; background: #1a1a1a; }
        .row { display: flex; justify-content: space-between; margin-bottom: 10px; align-items: center; }
        input { background: #000; color: #0f0; border: 1px solid #0f0; width: 80px; text-align: center; }
        textarea { width: 100%; height: 280px; background: #000; color: #fff; border: 1px solid #444; margin-top: 15px; font-size: 11px; }
        button { width: 100%; background: #0f0; color: #000; border: none; padding: 12px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        h2 { border-bottom: 1px solid #0f0; font-size: 14px; margin-top: 0; color: #fff; }
        .label { font-size: 11px; color: #888; }
    </style>
</head>
<body>

<div class="panel">
    <h2>DUAL-LINE + HATCH BOX</h2>
    
    <div class="row"><span>Width (W):</span> <input type="number" id="W" value="48.0"></div>
    <div class="row"><span>Height (H):</span> <input type="number" id="H" value="24.0"></div>
    <div class="row"><span>Thick (T):</span> <input type="number" id="T" value="2.0"></div>
    <div class="row"><span>Datum X:</span> <input type="number" id="DX" value="0.0"></div>
    <div class="row"><span>Datum Y:</span> <input type="number" id="DY" value="0.0"></div>

    <button onclick="generateHatchBox()">GENERATE FILLED WALL</button>

    <textarea id="output" readonly placeholder="Hatch-compatible tuples..."></textarea>
</div>

<script>
    function generateHatchBox() {
        const w = parseFloat(document.getElementById('W').value) || 0;
        const h = parseFloat(document.getElementById('H').value) || 0;
        const t = parseFloat(document.getElementById('T').value) || 0;
        const dx = parseFloat(document.getElementById('DX').value) || 0;
        const dy = parseFloat(document.getElementById('DY').value) || 0;

        // Outer Path (Clockwise)
        let out = `${dx} ${dy}\n${dx+w} ${dy}\n${dx+w} ${dy+h}\n${dx} ${dy+h}\n${dx} ${dy}\n\n`;
        
        // Inner Path (Counter-Clockwise for proper Fill logic)
        let inn = `${dx+t} ${dy+t}\n${dx+t} ${dy+h-t}\n${dx+w-t} ${dy+h-t}\n${dx+w-t} ${dy+t}\n${dx+t} ${dy+t}\n\n`;

        // WallyCAD v1.0.10 Hatch Trigger
        let hatch = "HATCH_SOLID";

        document.getElementById('output').value = out + inn + hatch;
    }
</script>
</body>
</html>
