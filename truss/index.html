<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WallyCAD v1.0.10 | Truss Analytics</title>
    <style>
        body { background: #121212; color: #00ff00; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .main-layout { display: flex; gap: 20px; width: 95%; max-width: 1200px; }
        #canvas-container { flex: 2; border: 1px solid #333; background: #000; padding: 10px; box-shadow: 0 0 15px rgba(0,255,0,0.1); }
        .data-panel { flex: 1; background: #1a1a1a; border: 1px solid #333; padding: 15px; height: 500px; overflow-y: auto; }
        .qc-input { background: #000; border: 2px solid #00ff00; color: #00ff00; padding: 12px; width: 400px; font-size: 1.2rem; margin: 20px 0; outline: none; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { border: 1px solid #333; padding: 8px; text-align: left; }
        th { background: #222; color: #888; }
        .btn { background: #00ff00; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn:hover { background: #00cc00; }
        h2, h3 { margin-top: 0; color: #fff; }
    </style>
</head>
<body>

    <h2>WallyCAD v1.0.10 - Truss Standalone</h2>
    <p style="color: #888;">2026: The Year of the Trailer | PTP Logic Enabled</p>

    <div class="main-layout">
        <div id="canvas-container">
            <canvas id="trussCanvas" width="700" height="400"></canvas>
            <div style="margin-top: 10px;">
                <button class="btn" onclick="downloadJSON()">EXPORT JSON</button>
            </div>
        </div>

        <div class="data-panel">
            <h3>Coordinate Table</h3>
            <table id="coordTable">
                <thead>
                    <tr>
                        <th>Node</th>
                        <th>X (ft)</th>
                        <th>Y (ft)</th>
                    </tr>
                </thead>
                <tbody id="coordBody"></tbody>
            </table>
        </div>
    </div>

    <input type="text" id="qcCommand" class="qc-input" placeholder="QC > T[SPAN]-[DEPTH]-[PANELS]" autofocus>

    <script>
        const canvas = document.getElementById('trussCanvas');
        const ctx = canvas.getContext('2d');
        const qcInput = document.getElementById('qcCommand');
        const coordBody = document.getElementById('coordBody');

        let config = { span: 7, depth: 1, panels: 6 };
        let nodes = [];

        function calculateNodes() {
            nodes = [];
            const panelWidth = config.span / config.panels;
            
            for (let i = 0; i <= config.panels; i++) {
                // Top Chord Nodes (T)
                nodes.push({ id: `T${i}`, x: (i * panelWidth).toFixed(3), y: config.depth.toFixed(3) });
                
                // Bottom Chord Nodes (B) - Center of the panel
                if (i < config.panels) {
                    nodes.push({ id: `B${i}`, x: ((i + 0.5) * panelWidth).toFixed(3), y: "0.000" });
                }
            }
            updateTable();
        }

        function updateTable() {
            coordBody.innerHTML = nodes.map(n => 
                `<tr><td>${n.id}</td><td>${n.x}</td><td>${n.y}</td></tr>`
            ).join('');
        }

        function drawTruss() {
            calculateNodes();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const margin = 50;
            const scaleX = (canvas.width - margin * 2) / config.span;
            const scaleY = 150; // Visual scale for height
            const startX = margin;
            const startY = canvas.height - 100;

            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 2;
            ctx.beginPath();

            // Render logic using the nodes array
            nodes.forEach((node, index) => {
                const px = startX + (node.x * scaleX);
                const py = startY - (node.y * scaleY);

                // Draw circles for nodes
                ctx.arc(px, py, 3, 0, Math.PI * 2);
                
                // Draw connecting lines based on index pattern
                if (index < nodes.length - 1) {
                    const nextNode = nodes[index + 1];
                    const nx = startX + (nextNode.x * scaleX);
                    const ny = startY - (nextNode.y * scaleY);
                    ctx.moveTo(px, py);
                    ctx.lineTo(nx, ny);
                }
            });

            ctx.stroke();
            
            // Labeling
            ctx.fillStyle = "#888";
            ctx.fillText(`Current Profile: ${config.span}' x ${config.depth}' (${config.panels} Panels)`, margin, 30);
        }

        qcInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const val = qcInput.value.toUpperCase();
                if (val.startsWith('T')) {
                    const p = val.substring(1).split('-');
                    if (p.length === 3) {
                        config.span = parseFloat(p[0]);
                        config.depth = parseFloat(p[1]);
                        config.panels = parseInt(p[2]);
                        drawTruss();
                    }
                }
                qcInput.value = '';
            }
        });

        function downloadJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(nodes, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", `truss_${config.span}ft.json`);
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        drawTruss();
    </script>
</body>
</html>
