<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WALLY V1.0.10 | COMMERCIAL STABLE</title>
    <script src="https://unpkg.com/jspdf@latest/dist/jspdf.umd.min.js"></script>
    <style>
        :root { --bg: #222; --cad-bg: #121212; --cmd-bg: #333; --accent: #61afef; --text: #eee; --dim: #888; --sel: #98c379; --print: #e5c07b; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Consolas', monospace; display: flex; flex-direction: column; height: 100vh; overflow: hidden; user-select: none; }
        
        #toolbar { height: 40px; background: #2c2c2c; border-bottom: 1px solid #444; display: flex; align-items: center; padding: 0 10px; gap: 5px; flex-shrink: 0; z-index: 1000; position: relative; }
        .menu-btn { cursor: pointer; color: var(--accent); font-size: 20px; font-weight: bold; padding: 0 5px; z-index: 9999; }
        .menu-btn:hover { color: white; }

        #workspace { flex-grow: 1; display: flex; position: relative; overflow: hidden; }
        #sidebar { width: 260px; background: #252526; border-right: 1px solid #444; display: flex; flex-direction: column; z-index: 2; overflow-y: auto; }
        #canvas-area { flex-grow: 1; position: relative; background: var(--cad-bg); cursor: crosshair; }
        #cmd-bar { height: 30px; background: var(--cmd-bg); border-top: 1px solid #555; display: flex; align-items: center; padding: 0 5px; font-size: 12px; flex-shrink: 0; }
        
        button { background: #444; border: 1px solid #555; color: #ddd; padding: 4px 8px; font-family: inherit; font-size: 11px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #555; border-color: var(--accent); }
        button.active { background: var(--accent); color: #111; border-color: var(--accent); }
        
        .panel { padding: 10px; border-bottom: 1px solid #333; }
        .panel-title { font-size: 11px; font-weight: bold; color: var(--accent); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        
        input, select, textarea { background: #111; border: 1px solid #444; color: var(--accent); padding: 4px; font-family: inherit; font-size: 11px; width: 100%; box-sizing: border-box; }
        input:focus, textarea:focus { border-color: var(--accent); outline: none; }
        .control-row { display: flex; gap: 5px; align-items: center; margin-bottom: 5px; }
        .label-sm { font-size: 10px; color: #888; width: 45px; flex-shrink: 0; cursor: help; }
        
        #cmd-prompt { color: var(--dim); margin-right: 5px; font-weight: bold; }
        #cmd-input { border: none; background: transparent; color: white; font-size: 12px; flex-grow: 1; outline: none; }
        
        .list-row { display: flex; justify-content: space-between; align-items: center; padding: 4px; font-size: 11px; cursor: pointer; border-bottom: 1px solid #333; }
        .list-row:hover { background: #333; }
        .list-row.selected { border-left: 3px solid var(--sel); background: #2a2a2a; }
        .layer-vis { width: 10px; height: 10px; border: 1px solid #666; margin-right: 5px; }
        .layer-vis.on { background: var(--accent); border-color: var(--accent); }

        #library { position: absolute; top: 40px; left: 10px; width: 220px; background: #252526; border: 1px solid #555; display: none; z-index: 9999; padding: 10px; box-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        .lib-item { padding: 8px 5px; border-bottom: 1px solid #333; cursor: pointer; font-size: 11px; color: #ccc; }
        .lib-item:hover { color: var(--accent); background: #333; }
        
        body.hal-mode #sidebar, body.hal-mode #toolbar, body.hal-mode #cmd-bar { display: none; }
        body.hal-mode #canvas-area { width: 100vw; height: 100vh; background: black; }
        #hal-exit { display: none; position: absolute; top: 20px; right: 20px; z-index: 100; background: red; color: white; border-radius: 50%; width: 40px; height: 40px; text-align: center; line-height: 40px; cursor: pointer; font-weight: bold; opacity: 0.5; }
        body.hal-mode #hal-exit { display: block; }

        .overlay-bg { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center; }
        .overlay-content { background: #1e1e1e; width: 85%; max-width: 800px; height: 85%; overflow-y: auto; padding: 40px; border: 1px solid var(--accent); position: relative; display: flex; flex-direction: column; }
        
        #nice-title {
            position: fixed;
            background: #1e1e1e;
            color: var(--accent);
            border: 1px solid #444;
            padding: 5px 8px;
            font-family: 'Consolas', monospace;
            font-size: 11px;
            font-weight: bold;
            pointer-events: none;
            z-index: 10000;
            display: none;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.8);
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div id="toolbar">
        <div class="menu-btn" onclick="toggleLibrary()">☰</div>
        <span style="font-weight:bold; color:var(--accent); margin-right:10px;" title="LKA CAD Engine">WALLY v1.0.10</span>
        <button onclick="fileNew()" title="Clear fresh">NEW</button>
        <button onclick="fileSave()" title="Save JSON">SAVE</button>
        <button onclick="fileLoad()" title="Load JSON">LOAD</button>
        <span style="width:1px; height:20px; background:#444; margin:0 5px;"></span>
        <button onclick="exec('WALL')" title="Spawn Wall">WALL</button>
        <button onclick="exec('CIRCLE')" style="color:#56b6c2;" title="Spawn Circle">CIRCLE</button>
        <button onclick="exec('STAIR')" style="color:#d19a66;" title="Spawn Stairs">STAIR</button>
        <button onclick="exec('DIM')" style="color:var(--print);" title="Spawn Dim">DIM</button>
        <button onclick="exec('TEXT')" style="color:#c678dd;" title="Spawn Text">TEXT</button>
        <span style="width:1px; height:20px; background:#444; margin:0 5px;"></span>
        <button onclick="exportDXF()" style="color:var(--sel);" title="Export DXF">DXF</button>
        <button onclick="exec('HAL')" title="Toggle Presentation">HAL VIEW</button>
        <span style="flex-grow:1;"></span>
        <button onclick="exec('HELP')" style="border-color:var(--accent); color:var(--accent);" title="Manual">MANUAL</button>
    </div>

    <div id="library">
        <div style="font-weight:bold; margin-bottom:5px; color:var(--accent);">PRESETS</div>
        <div class="lib-item" onclick="exec('BOOKMARK')" title="Load Template">Coff Bookmark Template</div>
    </div>

    <div id="workspace">
        <div id="sidebar">
            <div class="panel" style="border-left: 3px solid var(--print);">
                <div class="panel-title" style="color:var(--print);">PLOT SETTINGS</div>
                <div class="control-row">
                    <span class="label-sm">Paper</span>
                    <select id="paperSize" style="flex:1;"><option value="LETTER">Letter</option><option value="TABLOID">Tabloid</option></select>
                    <select id="paperOrient" style="width:40px;"><option value="L">L</option><option value="P">P</option></select>
                </div>
                <div class="control-row"><span class="label-sm">Units</span><select id="unitMap"><option value="IN">Inches</option><option value="FT">Feet</option><option value="MM">Millimeters</option></select></div>
                <div class="control-row"><span class="label-sm">Scale</span><input type="text" id="printScale" value="1/4&quot; = 1'-0&quot;"></div>
                <div class="control-row"><button onclick="autoFitScale()">AUTO FIT</button><button onclick="exportPDF()" style="background:var(--print); color:#111; font-weight:bold;">PDF PLOT</button></div>
            </div>

            <div class="panel">
                <div class="panel-title">PROPERTIES</div>
                <div class="control-row"><span class="label-sm">Type</span><select id="prop-type" onchange="updateProp()"><option value="WALL">Wall</option><option value="LINE">Line</option><option value="CIRCLE">Circle</option><option value="DIM">Dim</option><option value="TEXT">Text</option></select></div>
                <div class="control-row"><span class="label-sm">Layer</span><select id="prop-layer" onchange="updateProp()"></select></div>
                <div class="control-row"><span class="label-sm">Width/R</span><input id="prop-thick" type="number" step="0.1" oninput="updateProp()"></div>
                <textarea id="prop-geo" style="height:50px;" oninput="updateProp()"></textarea>
            </div>

            <div class="panel">
                <div class="panel-title">LAYERS</div>
                <div id="layer-list"></div>
                <button onclick="addLayer()" style="width:100%; margin-top:5px;">+ NEW LAYER</button>
            </div>
            
            <div class="panel" style="flex-grow:1; display:flex; flex-direction:column; min-height:150px;">
                <div class="panel-title">ENTITIES</div>
                <div id="ent-list" style="overflow-y:auto; flex-grow:1;"></div>
            </div>
        </div>

        <div id="canvas-area">
            <canvas id="canvas"></canvas>
            <div id="hal-exit" onclick="exec('HAL')">X</div>
        </div>
    </div>

    <div id="cmd-bar">
        <span id="cmd-prompt">COMMAND:</span>
        <input id="cmd-input" type="text" autocomplete="off" placeholder="Type...">
        <span id="cmd-history" style="color:#666; margin-left:10px;"></span>
    </div>

<script>
// ==========================================
// CORE STATE
// ==========================================
let state = {
    ents: [],
    layers: { '0': { color: '#ffffff', visible: true }, 'WALLS': { color: '#61afef', visible: true }, 'DIMS': { color: '#e5c07b', visible: true } },
    currentLayer: '0', 
    selection: null, 
    view: { x: 0, y: 0, scale: 5, panStart: null }, 
    mouse: { x: 0, y: 0, worldX: 0, worldY: 0, screenX: 0, screenY: 0, onUI: false }, 
    osnap: null
};

class M { 
    constructor(x,y){this.x=x;this.y=y} 
    sub(v){return new M(this.x-v.x,this.y-v.y)} 
    add(v){return new M(this.x+v.x,this.y+v.y)}
    mul(s){return new M(this.x*s,this.y*s)}
    div(s){return new M(this.x/s,this.y/s)}
    cross(v){return (this.x*v.y)-(this.y*v.x)}
    dot(v){return (this.x*v.x)+(this.y*v.y)}
    mag(){return Math.sqrt(this.x**2+this.y**2)}
    norm(){const m=this.mag();return m===0?new M(0,0):this.div(m)}
    perp(){return new M(-this.y,this.x)}
}

function parseCoords(txt) { 
    const pts=[]; if(!txt) return pts;
    txt.replace(/[\t\n\r,]+/g,' ').replace(/\s+/g,' ').trim().split(' ').forEach((v,i,a)=>{ 
        if(i%2===0 && a[i+1]){ 
            let x=parseFloat(v), y=parseFloat(a[i+1]); 
            if(!isNaN(x)&&!isNaN(y)) pts.push(new M(x,y)); 
        } 
    }); 
    return pts; 
}

function VIA(P1,v1,P2,v2,th){ 
    const det=v1.cross(v2); if(Math.abs(det)<1e-9)return null; 
    const t=(P2.sub(P1).x*v2.y - P2.sub(P1).y*v2.x)/det; 
    const I=P1.add(v1.mul(t)); 
    const mv=v1.mul(-1).add(v2).norm(); 
    const d = v1.mul(-1).dot(mv);
    const sq = Math.max(0, 1 - d*d); 
    const sm = sq === 0 ? 0 : (th/2)/Math.sqrt(sq); 
    return {I, In:I.add(mv.mul(sm)), Out:I.sub(mv.mul(sm)), Turn:det>0?'L':'R'}; 
}

function ComputeGeometry(txt, th) {
    const ptsM = parseCoords(txt); if(ptsM.length<2) return null;
    const N=ptsM.length; const j=[]; const cl=ptsM[0].sub(ptsM[N-1]).mag()<1e-4;
    for(let i=0;i<N;i++){
        let pp=i===0?null:ptsM[i-1], pn=i===N-1?null:ptsM[i+1], vin, vout, res;
        if(cl){ pp=ptsM[(i-1+N)%N]; pn=ptsM[(i+1)%N]; }
        if(pp) vin=ptsM[i].sub(pp).norm(); if(pn) vout=pn.sub(ptsM[i]).norm();
        if(pp&&pn){ const v=VIA(pp,vin,ptsM[i],vout,th); if(v) res=v.Turn==='L'?{L:v.In,R:v.Out}:{L:v.Out,R:v.In}; else{const p=vin.perp(); res={L:ptsM[i].add(p.mul(th/2)),R:ptsM[i].sub(p.mul(th/2))}} }
        else if(!pp){const p=vout.perp(); res={L:ptsM[i].add(p.mul(th/2)),R:ptsM[i].sub(p.mul(th/2))}}
        else{const p=vin.perp(); res={L:ptsM[i].add(p.mul(th/2)),R:ptsM[i].sub(p.mul(th/2))}}
        j.push(res);
    }
    return {points:ptsM, joints:j, isClosed:cl};
}

// ==========================================
// MOUSE & OSNAP HUD
// ==========================================
function onMove(e) {
    const r = document.getElementById('canvas').getBoundingClientRect();
    state.mouse.screenX = e.clientX;
    state.mouse.screenY = e.clientY;
    state.mouse.onUI = e.target.id !== 'canvas';
    
    if(state.view.panStart) { 
        state.view.x = state.view.panStart.vx + (e.clientX - state.view.panStart.x); 
        state.view.y = state.view.panStart.vy + (e.clientY - state.view.panStart.y); 
        draw(); return; 
    }
    
    state.mouse.worldX = ((e.clientX - r.left) - state.view.x) / state.view.scale;
    state.mouse.worldY = -((e.clientY - r.top) - state.view.y) / state.view.scale;
    
    calcOsnap();
    draw();
}

function calcOsnap() {
    state.osnap = null; 
    const tooltip = document.getElementById('nice-title');
    const t = 15 / state.view.scale; 
    
    state.ents.forEach(ent => {
        if(!state.layers[ent.layer].visible) return;
        const pts = parseCoords(ent.geo);
        pts.forEach(p => {
            if(Math.hypot(p.x - state.mouse.worldX, p.y - state.mouse.worldY) < t) state.osnap = p;
        });
    });

    if (state.osnap && !state.view.panStart) {
        tooltip.innerText = `${state.osnap.x.toFixed(3)}, ${state.osnap.y.toFixed(3)}`;
        tooltip.style.display = 'block';
        tooltip.style.left = (state.mouse.screenX + 15) + 'px';
        tooltip.style.top = (state.mouse.screenY + 15) + 'px';
        tooltip.style.borderColor = 'yellow';
    } else {
        if (!state.mouse.onUI) tooltip.style.display = 'none';
        tooltip.style.borderColor = '#444';
    }
}

function draw() {
    const cvs = document.getElementById('canvas'); const ctx = cvs.getContext('2d');
    ctx.fillStyle = document.body.classList.contains('hal-mode') ? 'black' : '#121212';
    ctx.fillRect(0, 0, cvs.width, cvs.height);
    
    if (!document.body.classList.contains('hal-mode')) {
        ctx.strokeStyle = '#222'; ctx.lineWidth = 1; ctx.beginPath();
        const step = 10 * state.view.scale; const ox = state.view.x % step, oy = state.view.y % step;
        for(let x=ox; x<cvs.width; x+=step) { ctx.moveTo(x,0); ctx.lineTo(x,cvs.height); }
        for(let y=oy; y<cvs.height; y+=step) { ctx.moveTo(0,y); ctx.lineTo(cvs.width,y); }
        ctx.stroke();
    }

    ctx.save(); ctx.translate(state.view.x, state.view.y); ctx.scale(state.view.scale, -state.view.scale);

    state.ents.forEach(ent => {
        const lay = state.layers[ent.layer] || state.layers['0']; if (!lay.visible) return;
        const isSel = state.selection === ent;
        const col = isSel ? '#98c379' : (document.body.classList.contains('hal-mode') ? 'red' : lay.color);
        const pts = parseCoords(ent.geo); if(pts.length===0) return;

        if (ent.type === 'CIRCLE') {
            const r = ent.thick || 1; ctx.strokeStyle = col; ctx.lineWidth = 1/state.view.scale;
            ctx.beginPath(); ctx.arc(pts[0].x, pts[0].y, r, 0, Math.PI*2); ctx.stroke(); return;
        }

        const geo = ComputeGeometry(ent.geo, ent.thick); if(!geo) return;
        ctx.strokeStyle = col; ctx.lineWidth = 1 / state.view.scale;
        if (ent.thick > 0 && ent.type !== 'LINE') {
            const dp=(a)=>{ctx.beginPath(); a.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y)); if(geo.isClosed)ctx.closePath(); ctx.stroke();}
            dp(geo.joints.map(j=>j.L)); dp(geo.joints.map(j=>j.R));
            ctx.globalAlpha = 0.2; ctx.beginPath(); geo.points.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y)); ctx.stroke(); ctx.globalAlpha = 1.0;
        } else {
            ctx.beginPath(); geo.points.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y)); if(geo.isClosed)ctx.closePath(); ctx.stroke();
        }
    });

    if(state.osnap) { 
        ctx.strokeStyle = 'yellow'; ctx.lineWidth = 2 / state.view.scale; 
        const sSize = 12 / state.view.scale; 
        ctx.strokeRect(state.osnap.x - sSize/2, state.osnap.y - sSize/2, sSize, sSize); 
    }
    ctx.restore();
}

// ==========================================
// INIT & TOOLBAR
// ==========================================
window.onload = () => {
    const cvs = document.getElementById('canvas');
    resize(); window.addEventListener('resize', resize);
    cvs.addEventListener('mousedown', onDown); 
    window.addEventListener('mousemove', onMove); 
    window.addEventListener('mouseup', () => state.view.panStart = null);
    cvs.addEventListener('wheel', e => { state.view.scale *= e.deltaY<0 ? 1.1 : 0.9; draw(); });
    initNiceTitles();
    renderLayers();
};

function initNiceTitles() {
    const tooltip = document.createElement('div');
    tooltip.id = 'nice-title';
    document.body.appendChild(tooltip);
    document.querySelectorAll('[title]').forEach(el => {
        const text = el.getAttribute('title');
        el.addEventListener('mouseenter', () => { tooltip.innerText = text; tooltip.style.display = 'block'; });
        el.addEventListener('mouseleave', () => { if(!state.osnap) tooltip.style.display = 'none'; });
    });
}

function onDown(e) { 
    if(e.button === 2 || (e.button === 0 && e.altKey)) { 
        state.view.panStart = { x: e.clientX, y: e.clientY, vx: state.view.x, vy: state.view.y }; return; 
    } 
    const t=10/state.view.scale;
    state.selection = state.ents.find(ent => parseCoords(ent.geo).some(p => Math.abs(p.x-state.mouse.worldX)<t && Math.abs(p.y-state.mouse.worldY)<t));
    if(state.selection) {
        document.getElementById('prop-type').value=state.selection.type;
        document.getElementById('prop-thick').value=state.selection.thick;
        document.getElementById('prop-geo').value=state.selection.geo;
    }
    renderList(); draw();
}

function exec(cmd) {
    if(cmd==='WALL') createEnt('WALL', '0', "0,0\n20,0", 5);
    if(cmd==='CIRCLE') createEnt('CIRCLE', '0', "0,0", 5);
    if(cmd==='HAL') { document.body.classList.toggle('hal-mode'); resize(); }
    draw();
}

function createEnt(type, layer, geo, thick) {
    const ent = {type, layer, geo, thick}; state.ents.push(ent); state.selection=ent; renderList();
}

function updateProp() {
    if(!state.selection) return;
    state.selection.type = document.getElementById('prop-type').value;
    state.selection.thick = parseFloat(document.getElementById('prop-thick').value);
    state.selection.geo = document.getElementById('prop-geo').value;
    draw();
}

function resize() { const p=document.getElementById('canvas-area'); canvas.width=p.clientWidth; canvas.height=p.clientHeight; draw(); }
function renderLayers() { 
    const sel=document.getElementById('prop-layer'); 
    Object.keys(state.layers).forEach(n => { const o=document.createElement('option'); o.value=n; o.text=n; sel.add(o); });
}
function renderList() {
    const list=document.getElementById('ent-list'); list.innerHTML='';
    state.ents.forEach(e => { const d=document.createElement('div'); d.className='list-row'; d.innerText=e.type; list.appendChild(d); });
}
</script>
</body>
</html>
