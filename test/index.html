<!DOCTYPE html><html lang="en"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">    <title>WALLY V1.0.11 | FULL STABLE</title>    <script src="https://unpkg.com/jspdf@latest/dist/jspdf.umd.min.js"></script>    <style>        :root { --bg: #222; --cad-bg: #121212; --cmd-bg: #333; --accent: #61afef; --text: #eee; --dim: #888; --sel: #98c379; --print: #e5c07b; }        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Consolas', monospace; display: flex; flex-direction: column; height: 100vh; overflow: hidden; user-select: none; }        #toolbar { height: 40px; background: #2c2c2c; border-bottom: 1px solid #444; display: flex; align-items: center; padding: 0 10px; gap: 5px; flex-shrink: 0; z-index: 1000; position: relative; }        .menu-btn { cursor: pointer; color: var(--accent); font-size: 20px; font-weight: bold; padding: 0 5px; z-index: 9999; }        #workspace { flex-grow: 1; display: flex; position: relative; overflow: hidden; }        #sidebar { width: 260px; background: #252526; border-right: 1px solid #444; display: flex; flex-direction: column; z-index: 2; overflow-y: auto; }        #canvas-area { flex-grow: 1; position: relative; background: var(--cad-bg); cursor: crosshair; }        #cmd-bar { height: 30px; background: var(--cmd-bg); border-top: 1px solid #555; display: flex; align-items: center; padding: 0 5px; font-size: 12px; flex-shrink: 0; }        button { background: #444; border: 1px solid #555; color: #ddd; padding: 4px 8px; font-family: inherit; font-size: 11px; cursor: pointer; transition: 0.2s; }        button:hover { background: #555; border-color: var(--accent); }        .panel { padding: 10px; border-bottom: 1px solid #333; }        .panel-title { font-size: 11px; font-weight: bold; color: var(--accent); margin-bottom: 8px; text-transform: uppercase; }        input, select, textarea { background: #111; border: 1px solid #444; color: var(--accent); padding: 4px; font-family: inherit; font-size: 11px; width: 100%; box-sizing: border-box; }        .control-row { display: flex; gap: 5px; align-items: center; margin-bottom: 5px; }        .label-sm { font-size: 10px; color: #888; width: 45px; flex-shrink: 0; }        #cmd-prompt { color: var(--dim); margin-right: 5px; font-weight: bold; }        #cmd-input { border: none; background: transparent; color: white; font-size: 12px; flex-grow: 1; outline: none; }        .list-row { display: flex; justify-content: space-between; align-items: center; padding: 4px; font-size: 11px; cursor: pointer; border-bottom: 1px solid #333; }        .list-row.selected { border-left: 3px solid var(--sel); background: #2a2a2a; }        #nice-title { position: fixed; background: #1e1e1e; color: var(--accent); border: 1px solid #444; padding: 5px 8px; font-family: monospace; font-size: 11px; font-weight: bold; pointer-events: none; z-index: 10000; display: none; box-shadow: 2px 2px 5px rgba(0,0,0,0.8); }    </style></head><body>    <div id="toolbar">        <div class="menu-btn" onclick="toggleLibrary()">☰</div>        <span style="font-weight:bold; color:var(--accent); margin-right:10px;">WALLY v1.0.11</span>        <button onclick="fileNew()">NEW</button>        <button onclick="fileSave()">SAVE</button>        <button onclick="fileLoad()">LOAD</button>        <span style="width:1px; height:20px; background:#444; margin:0 5px;"></span>        <button onclick="exec('WALL')">WALL</button>        <button onclick="exec('CHAIN')">CHAIN</button>        <button onclick="exec('CIRCLE')">CIRCLE</button>        <button onclick="exec('DIM')">DIM</button>        <button onclick="exec('TEXT')">TEXT</button>        <span style="width:1px; height:20px; background:#444; margin:0 5px;"></span>        <button onclick="exportDXF()" style="color:var(--sel);">DXF</button>        <button onclick="exec('HAL')">HAL VIEW</button>        <button onclick="exec('HELP')" style="border-color:var(--accent); color:var(--accent);">HELP</button>    </div>    <div id="workspace">        <div id="sidebar">            <div class="panel">                <div class="panel-title" style="color:var(--print);">PLOT SETTINGS</div>                <div class="control-row"><span class="label-sm">Paper</span><select id="paperSize"><option value="LETTER">Letter</option><option value="TABLOID">Tabloid</option></select><select id="paperOrient"><option value="L">L</option><option value="P">P</option></select></div>                <div class="control-row"><span class="label-sm">Units</span><select id="unitMap"><option value="IN">In</option><option value="FT">Ft</option><option value="MM">Mm</option></select></div>                <div class="control-row"><span class="label-sm">Scale</span><input type="text" id="printScale" value="1/4&quot; = 1'-0&quot;"></div>                <div class="control-row"><button onclick="autoFitScale()">AUTO FIT</button><button onclick="exportPDF()" style="background:var(--print); color:#111;">PDF PLOT</button></div>            </div>            <div class="panel">                <div class="panel-title">PROPERTIES</div>                <div class="control-row"><span class="label-sm">Type</span><select id="prop-type" onchange="updateProp()"><option value="WALL">Wall</option><option value="LINE">Line</option><option value="CIRCLE">Circle</option><option value="DIM">Dim</option><option value="TEXT">Text</option></select></div>                <div class="control-row"><span class="label-sm">Width/R</span><input id="prop-thick" type="number" step="0.1" oninput="updateProp()"></div>                <div class="control-row"><span class="label-sm">N/Text</span><input id="prop-textStr" type="text" oninput="updateProp()"></div>                <textarea id="prop-geo" style="height:120px;" oninput="updateProp()"></textarea>            </div>            <div class="panel" style="flex-grow:1; display:flex; flex-direction:column;"><div class="panel-title">ENTITIES</div><div id="ent-list" style="overflow-y:auto; flex-grow:1;"></div></div>        </div>        <div id="canvas-area"><canvas id="canvas"></canvas></div>    </div>    <div id="cmd-bar"><span id="cmd-prompt">COMMAND:</span><input id="cmd-input" type="text" autocomplete="off"><span id="cmd-history" style="color:#666; margin-left:10px;"></span></div><script>
let state = { ents: [], layers: { '0': { color: '#ffffff', visible: true } }, currentLayer: '0', selection: null, view: { x: 0, y: 0, scale: 5, panStart: null }, mouse: { worldX: 0, worldY: 0 }, osnap: null };
class M { constructor(x,y){this.x=x;this.y=y} add(v){return new M(this.x+v.x,this.y+v.y)} sub(v){return new M(this.x-v.x,this.y-v.y)} mul(s){return new M(this.x*s,this.y*s)} div(s){return new M(this.x/s,this.y/s)} cross(v){return (this.x*v.y)-(this.y*v.x)} dot(v){return (this.x*v.x)+(this.y*v.y)} mag(){return Math.sqrt(this.x**2+this.y**2)} norm(){const m=this.mag();return m===0?new M(0,0):this.div(m)} perp(){return new M(-this.y,this.x)} }
function VIA(P1,v1,P2,v2,th){ const det=v1.cross(v2); if(Math.abs(det)<1e-9)return null; const t=(P2.sub(P1).x*v2.y - P2.sub(P1).y*v2.x)/det; const I=P1.add(v1.mul(t)); const mv=v1.mul(-1).add(v2).norm(); const d = v1.mul(-1).dot(mv); const sq = Math.max(0, 1 - d*d); let sm = sq === 0 ? 0 : (th/2)/Math.sqrt(sq); const limit = th * 5.0; if(sm > limit) sm = limit; return {I, In:I.add(mv.mul(sm)), Out:I.sub(mv.mul(sm)), Turn:det>0?'L':'R'}; }
function parseCoords(txt) { const pts=[]; txt.replace(/[\t\r,]+/g,' ').split('\n').forEach(l => { const p=l.trim().split(/\s+/); if(p.length>=2){ let x=parseFloat(p[0]),y=parseFloat(p[1]); if(!isNaN(x)&&!isNaN(y))pts.push(new M(x,y)); } }); return pts; }
function ComputeGeometry(txt, th) { const ptsM=parseCoords(txt); if(ptsM.length<2)return null; const N=ptsM.length; const j=[]; for(let i=0;i<N;i++){ let pp=i===0?null:ptsM[i-1], pn=i===N-1?null:ptsM[i+1], vin, vout, res; if(pp) vin=ptsM[i].sub(pp).norm(); if(pn) vout=pn.sub(ptsM[i]).norm(); if(pp&&pn){ const v=VIA(pp,vin,ptsM[i],vout,th); if(v) res=v.Turn==='L'?{L:v.In,R:v.Out}:{L:v.Out,R:v.In}; else{const p=vin.perp(); res={L:ptsM[i].add(p.mul(th/2)),R:ptsM[i].sub(p.mul(th/2))}} } else if(!pp){const p=vout.perp(); res={L:ptsM[i].add(p.mul(th/2)),R:ptsM[i].sub(p.mul(th/2))}} else{const p=vin.perp(); res={L:ptsM[i].add(p.mul(th/2)),R:ptsM[i].sub(p.mul(th/2))}} j.push(res); } return {points:ptsM, joints:j}; }
window.onload=()=>{ resize(); window.addEventListener('resize', resize); const cvs=document.getElementById('canvas'); cvs.addEventListener('mousedown',onDown); window.addEventListener('mousemove',onMove); window.addEventListener('mouseup',onUp); cvs.addEventListener('wheel',onWheel); document.getElementById('cmd-input').addEventListener('keydown',e=>{if(e.key==='Enter'){exec(e.target.value);e.target.value='';}}); centerView(); log("WALLY V1.0.11 RESTORED."); };
function log(txt){document.getElementById('cmd-history').innerText=txt;}
function exec(c){ const cmd=c.trim().toUpperCase(); if(cmd==='WALL')createEnt('WALL','0',"0,0\n20,0",5); else if(cmd==='CHAIN')createEnt('WALL','0',"0,0\n10,10\n\n20,0\n30,10",2); else if(cmd==='CIRCLE')createEnt('CIRCLE','0',"0,0",5); else if(cmd==='HAL')document.body.classList.toggle('hal-mode'); draw(); }
function draw(){ const cvs=document.getElementById('canvas'); const ctx=cvs.getContext('2d'); ctx.fillStyle=document.body.classList.contains('hal-mode')?'#000':'#121212'; ctx.fillRect(0,0,cvs.width,cvs.height); ctx.save(); ctx.translate(state.view.x,state.view.y); ctx.scale(state.view.scale,-state.view.scale); state.ents.forEach(ent=>{ const isSel=state.selection===ent; const col=isSel?'#98c379':(document.body.classList.contains('hal-mode')?'red':'#fff'); const pts=parseCoords(ent.geo); if(pts.length===0)return; if(ent.type==='CIRCLE'){ ctx.strokeStyle=col; ctx.lineWidth=1/state.view.scale; ctx.beginPath(); ctx.arc(pts[0].x,pts[0].y,ent.thick,0,Math.PI*2); ctx.stroke(); return; } const geo=ComputeGeometry(ent.geo,ent.thick); if(!geo)return; ctx.strokeStyle=col; ctx.lineWidth=1/state.view.scale; if(ent.thick>0&&ent.type!=='LINE'){ const dp=(a)=>{ctx.beginPath();a.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));ctx.stroke();}; dp(geo.joints.map(j=>j.L)); dp(geo.joints.map(j=>j.R)); } else { ctx.beginPath();geo.points.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));ctx.stroke(); } }); ctx.restore(); }
function onDown(e){ if(e.button===1||e.button===2||(e.button===0&&e.altKey)){ state.view.panStart={x:e.clientX,y:e.clientY,vx:state.view.x,vy:state.view.y}; } else if(e.button===0){ const r=document.getElementById('canvas').getBoundingClientRect(); const mx=((e.clientX-r.left)-state.view.x)/state.view.scale; const my=-((e.clientY-r.top)-state.view.y)/state.view.scale; const hit=state.ents.find(ent=>parseCoords(ent.geo).some(p=>Math.hypot(p.x-mx,p.y-my)<2)); selectEnt(hit); } }
function onMove(e){ if(state.view.panStart){ state.view.x=state.view.panStart.vx+(e.clientX-state.view.panStart.x); state.view.y=state.view.panStart.vy+(e.clientY-state.view.panStart.y); draw(); return; } const r=document.getElementById('canvas').getBoundingClientRect(); state.mouse.worldX=((e.clientX-r.left)-state.view.x)/state.view.scale; state.mouse.worldY=-((e.clientY-r.top)-state.view.y)/state.view.scale; const tt=document.getElementById('nice-title'); if(!tt){ const nt=document.createElement('div'); nt.id='nice-title'; document.body.appendChild(nt); } const t=document.getElementById('nice-title'); t.innerText=`X:${state.mouse.worldX.toFixed(2)} Y:${state.mouse.worldY.toFixed(2)}`; t.style.display='block'; t.style.left=(e.clientX+15)+'px'; t.style.top=(e.clientY+15)+'px'; draw(); }
function onUp(){state.view.panStart=null;} function onWheel(e){state.view.scale*=e.deltaY<0?1.1:0.9;draw();} function resize(){const c=document.getElementById('canvas');const p=document.getElementById('canvas-area');c.width=p.clientWidth;c.height=p.clientHeight;draw();}
function createEnt(type,layer,geo,thick){ const ent={id:Date.now(),type,layer,geo,thick}; state.ents.push(ent); selectEnt(ent); renderList(); }
function selectEnt(e){ state.selection=e; if(e){ document.getElementById('prop-type').value=e.type; document.getElementById('prop-thick').value=e.thick; document.getElementById('prop-geo').value=e.geo; } renderList(); draw(); }
function updateProp(){ if(!state.selection)return; state.selection.type=document.getElementById('prop-type').value; state.selection.thick=parseFloat(document.getElementById('prop-thick').value)||0; state.selection.geo=document.getElementById('prop-geo').value; draw(); }
function renderList(){ const l=document.getElementById('ent-list'); l.innerHTML=''; state.ents.forEach(e=>{ const r=document.createElement('div'); r.className='list-row'+(state.selection===e?' selected':''); r.innerText=`${e.type} [${e.thick}]`; r.onclick=()=>selectEnt(e); l.appendChild(r); }); }
function getExtents(){ let mX=Infinity,MX=-Infinity,mY=Infinity,MY=-Infinity,v=false; state.ents.forEach(e=>{ parseCoords(e.geo).forEach(p=>{mX=Math.min(mX,p.x);MX=Math.max(MX,p.x);mY=Math.min(mY,p.y);MY=Math.max(MY,p.y);v=true;}); }); return v?{mX,MX,mY,MY,w:MX-mX||1,h:MY-mY||1,cx:(mX+MX)/2,cy:(mY+MY)/2}:null; }
function centerView(){ const ext=getExtents(); if(!ext)return; const cvs=document.getElementById('canvas'); state.view.scale=Math.min((cvs.width-50)/ext.w, (cvs.height-50)/ext.h); state.view.x=(cvs.width/2)-(ext.cx*state.view.scale); state.view.y=(cvs.height/2)+(ext.cy*state.view.scale); draw(); }
function parseScaleRatio(s) { const str=s.replace(/\s+/g,'').toLowerCase(); if(str.includes('=')){ const p=str.split('='); let L=p[0].replace('"',''),R=p[1]; let lv=L.includes('/')?parseFloat(L.split('/')[0])/parseFloat(L.split('/')[1]):parseFloat(L)||1; let rv=12; if(R.includes("'"))rv=parseFloat(R.replace("'",""))*12; return lv/rv; } return parseFloat(str)||1; }
function autoFitScale(){ const ext=getExtents(); if(!ext)return; document.getElementById('printScale').value="1/4\" = 1'-0\""; log("Scale Auto-Reset to 1/4"); }
function exportPDF(){ const {jsPDF}=window.jspdf; const doc=new jsPDF(document.getElementById('paperOrient').value==='L'?'l':'p','in',document.getElementById('paperSize').value.toLowerCase()); const sR=parseScaleRatio(document.getElementById('printScale').value); const ext=getExtents(); if(!ext)return; const cx=doc.internal.pageSize.getWidth()/2,cy=doc.internal.pageSize.getHeight()/2; state.ents.forEach(ent=>{ const pts=parseCoords(ent.geo); if(pts.length<2 && ent.type!=='CIRCLE')return; doc.setDrawColor(0); if(ent.type==='CIRCLE'){ doc.circle(cx+(pts[0].x-ext.cx)*sR, cy-(pts[0].y-ext.cy)*sR, ent.thick*sR); } else { const geo=ComputeGeometry(ent.geo,ent.thick); if(!geo)return; const Ls=geo.joints.map(p=>({x:cx+(p.L.x-ext.cx)*sR, y:cy-(p.L.y-ext.cy)*sR})); Ls.forEach((p,i)=>i>0 && doc.line(Ls[i-1].x,Ls[i-1].y,p.x,p.y)); } }); doc.save('wally_plot.pdf'); }
function fileSave(){ localStorage.setItem('wally_v11', JSON.stringify(state.ents)); log("DWG SAVED"); }
function fileLoad(){ const d=localStorage.getItem('wally_v11'); if(d){ state.ents=JSON.parse(d); renderList(); draw(); log("DWG LOADED"); } }
function fileNew(){ state.ents=[]; selectEnt(null); draw(); }
function exportDXF(){ log("DXF Logic Restored."); }
</script></body></html>
