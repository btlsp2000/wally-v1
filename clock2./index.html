
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="https://btlsp2000.tripod.com/b/clock.png">
    <title>Sandra's Products | Zen Dashboard</title>
    <style>
        :root {
            --brand-mint: #C8F7C5;
            --brand-orange: #E67E22;
            --brand-green: #27AE60;
            --bg-color: #FCF3CF;
            --text-color: #333;
            --btn-bg: #f9e79f;
            --accent: #555;
            --card-bg: rgba(255, 255, 255, 0.7);
        }

        [data-theme="dark"] {
            --bg-color: #2c3e50;
            --text-color: #ecf0f1;
            --btn-bg: #16a085;
            --accent: #bdc3c7;
            --card-bg: rgba(0, 0, 0, 0.4);
        }

        body {
            background-color: var(--bg-color);
            background-attachment: fixed;
            background-size: cover;
            color: var(--text-color);
            font-family: 'Segoe UI', sans-serif;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            transition: all 0.5s ease;
            min-height: 100vh;
        }

        body.focus-active {
            background-image: url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=2560&auto=format&fit=crop');
            --text-color: #ffffff;
        }

        #branding-header {
            width: 100%; max-width: 600px;
            display: flex; justify-content: space-between; align-items: center;
            background: #D5DBDB; border-bottom: 5px solid black;
            padding: 10px 20px; margin-bottom: 20px; color: #333;
            border-radius: 8px 8px 0 0;
        }

        .logo-box { font-weight: bold; font-size: 1.1rem; letter-spacing: 1px; }
        .contact-info { font-size: 0.85rem; text-align: right; line-height: 1.3; }

        .btn-ui {
            padding: 10px 20px; border-radius: 50px; border: 2px solid var(--accent);
            background: var(--btn-bg); color: var(--text-color);
            cursor: pointer; font-weight: bold; margin: 5px; transition: 0.2s;
        }
        .btn-focus { background: var(--brand-orange); color: white; border: none; }
        .btn-pdf { background: #3498db; color: white; border: none; font-size: 0.8rem; margin-top: 10px; width: 100%; }
        .btn-clear { background: #95a5a6; color: white; border: none; font-size: 0.7rem; padding: 5px 10px; margin-top: 5px; }

        #todo-section { 
            width: 100%; max-width: 400px; padding: 20px; border-radius: 15px; 
            background: var(--card-bg); border-top: 5px solid var(--brand-green);
            backdrop-filter: blur(5px);
        }

        .todo-item { display: flex; align-items: center; gap: 10px; padding: 8px; border-bottom: 1px solid var(--accent); }
        .todo-text { flex: 1; cursor: pointer; transition: 0.2; }
        .todo-text.done { text-decoration: line-through; opacity: 0.5; }
        .delete-btn { color: #e74c3c; cursor: pointer; font-weight: bold; font-size: 1.2rem; }

        .hidden { display: none !important; }
        iframe { border-radius: 15px; border: 4px solid var(--brand-green); background: white; }

        @media print {
            body { background: white !important; color: black !important; padding: 0; }
            #nav-header, .controls, #clock-section, #calendar-section, .btn-ui, #todo-section div, .delete-btn { display: none !important; }
            #branding-header { display: flex !important; width: 100%; border-radius: 0; margin-bottom: 30px; }
            #todo-section { display: block !important; border: none !important; background: transparent !important; max-width: 100%; width: 100%; }
            .todo-item { border-bottom: 1px solid #ccc !important; }
        }
    </style>
</head>
<body id="bodyTag">

<div id="branding-header">
    <div class="logo-box">SANDRA'S PRODUCTS</div>
    <div class="contact-info">
        <strong>Sandra Tonnesen</strong><br>
        sandrasproducts.com<br>
        btlsp2013@gmail.com<br>
        (503) 830-3419
    </div>
</div>

<div id="nav-header">
    <button class="btn-ui" id="swapBtn" onclick="toggleLayout()">&#128260; Swap View</button>
    <button class="btn-ui btn-focus" id="focusBtn" onclick="toggleFocus()">&#127919; Focus Mode</button>
</div>

<div id="main-container" style="display:flex; flex-direction:column; align-items:center; gap:20px; width:100%;">
    <div id="clock-section" style="order:1; display:flex; flex-direction:column; align-items:center;">
        <canvas id="clockCanvas" width="240" height="240"></canvas>
        <div id="digital-clock" style="font-size:1.8rem; font-family:monospace; font-weight:bold;">00:00:00 AM</div>
    </div>

    <div id="calendar-section" style="order:2;">
        <iframe id="gmi" src="https://calendar.google.com/calendar/embed?src=btlsp2013%40gmail.com&ctz=America%2FLos_Angeles&color=%2327AE60" width="320" height="300" frameborder="0" scrolling="no"></iframe>
    </div>

    <div id="todo-section" style="order:3;">
        <h3 style="margin-top:0; color:var(--brand-green);">&#128221; Product Tasks</h3>
        <div style="display:flex; gap:5px; margin-bottom:10px;">
            <input type="text" id="todoInput" style="flex:1; padding:8px;" placeholder="Next goal for Sandra's Products...">
            <button class="btn-ui" style="margin:0; padding:5px 15px;" onclick="addTodo()">Add</button>
        </div>
        <ul id="todoList" style="list-style:none; padding:0;"></ul>
        
        <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
            <button class="btn-ui btn-pdf" onclick="window.print()">&#128196; Export to PDF</button>
            <button class="btn-ui btn-clear" onclick="clearCompleted()">&#128465;&#65039; Clear Completed</button>
        </div>
    </div>
</div>

<div class="controls" id="footerControls" style="margin-top:20px;">
    <button class="btn-ui" onclick="toggleTheme()">&#127763; Theme</button>
    <button class="btn-ui" onclick="resize(640, 600)">&#128269; Enlarge</button>
</div>

<script>
    let isClockTop = true;
    let isFocusMode = false;

    // Task & Clock logic follows standard functions provided previously...
    // [Internal Logic remains the same to preserve functionality]
    let todos = JSON.parse(localStorage.getItem('sandraTodos')) || [];

    function renderTodos() {
        const list = document.getElementById('todoList');
        list.innerHTML = '';
        todos.forEach((todo, index) => {
            const li = document.createElement('li');
            li.className = 'todo-item';
            li.innerHTML = `
                <input type="checkbox" ${todo.completed ? 'checked' : ''} onclick="toggleTodo(${index})">
                <span class="todo-text ${todo.completed ? 'done' : ''}" onclick="toggleTodo(${index})">${todo.text}</span>
                <span class="delete-btn" onclick="removeTodo(${index})">&#10005;</span>
            `;
            list.appendChild(li);
        });
        localStorage.setItem('sandraTodos', JSON.stringify(todos));
    }

    function addTodo() {
        const input = document.getElementById('todoInput');
        if (input.value.trim()) {
            todos.push({ text: input.value, completed: false });
            input.value = '';
            renderTodos();
        }
    }

    function toggleTodo(index) {
        todos[index].completed = !todos[index].completed;
        renderTodos();
    }

    function removeTodo(index) {
        todos.splice(index, 1);
        renderTodos();
    }

    function clearCompleted() {
        todos = todos.filter(t => !t.completed);
        renderTodos();
    }

    function toggleFocus() {
        isFocusMode = !isFocusMode;
        document.body.classList.toggle('focus-active');
        document.getElementById('branding-header').classList.toggle('hidden');
        document.getElementById('calendar-section').classList.toggle('hidden');
        document.getElementById('footerControls').classList.toggle('hidden');
        document.getElementById('swapBtn').classList.toggle('hidden');
        document.getElementById('focusBtn').innerHTML = isFocusMode ? "&#127807; Exit Focus" : "&#127919; Focus Mode";
        updateClocks();
    }

    function toggleLayout() {
        isClockTop = !isClockTop;
        document.getElementById('clock-section').style.order = isClockTop ? "1" : "2";
        document.getElementById('calendar-section').style.order = isClockTop ? "2" : "1";
    }

    const canvas = document.getElementById("clockCanvas");
    const ctx = canvas.getContext("2d");
    let radius = canvas.height / 2;
    ctx.translate(radius, radius);
    radius = radius * 0.90;

    function updateClocks() {
        const now = new Date();
        const styles = getComputedStyle(document.body);
        const textColor = styles.getPropertyValue('--text-color').trim();
        ctx.clearRect(-radius-20, -radius-20, canvas.width+40, canvas.height+40);
        ctx.beginPath(); ctx.arc(0, 0, radius, 0, 2*Math.PI);
        ctx.fillStyle = isFocusMode ? "rgba(255,255,255,0.1)" : "white"; ctx.fill();
        ctx.strokeStyle = isFocusMode ? "white" : "black"; ctx.lineWidth = 4; ctx.stroke();
        drawNumbers(ctx, radius, isFocusMode ? "white" : "black");
        drawTime(ctx, radius, now, isFocusMode ? "white" : "black");
        let h = now.getHours();
        let ampm = h >= 12 ? 'PM' : 'AM';
        h = h % 12 || 12;
        document.getElementById("digital-clock").innerHTML = `${h}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')} ${ampm}`;
    }

    function drawNumbers(ctx, radius, color) {
        ctx.font = radius * 0.15 + "px arial"; ctx.fillStyle = color;
        ctx.textBaseline = "middle"; ctx.textAlign = "center";
        for(let num = 1; num < 13; num++){
            let ang = num * Math.PI / 6;
            ctx.rotate(ang); ctx.translate(0, -radius * 0.85); ctx.rotate(-ang);
            ctx.fillText(num.toString(), 0, 0);
            ctx.rotate(ang); ctx.translate(0, radius * 0.85); ctx.rotate(-ang);
        }
    }

    function drawTime(ctx, radius, now, color){
        let h = now.getHours() % 12, m = now.getMinutes(), s = now.getSeconds();
        drawHand(ctx, (h*Math.PI/6)+(m*Math.PI/(6*60)), radius*0.5, 6, color);
        drawHand(ctx, (m*Math.PI/30), radius*0.8, 4, color);
        drawHand(ctx, (s*Math.PI/30), radius*0.9, 2, "orange");
    }

    function drawHand(ctx, pos, length, width, color) {
        ctx.beginPath(); ctx.lineWidth = width; ctx.lineCap = "round";
        ctx.strokeStyle = color; ctx.moveTo(0,0);
        ctx.rotate(pos); ctx.lineTo(0, -length); ctx.stroke(); ctx.rotate(-pos);
    }

    function toggleTheme() {
        const body = document.body;
        body.getAttribute("data-theme") === "dark" ? body.removeAttribute("data-theme") : body.setAttribute("data-theme", "dark");
        updateClocks();
    }

    function resize(w, h) {
        const iframe = document.getElementById("gmi");
        iframe.style.width = w + "px"; iframe.style.height = h + "px";
    }

    setInterval(updateClocks, 1000);
    renderTodos();
    updateClocks();
</script>
</body>
</html>
