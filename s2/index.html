
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Workspace with Export</title>
    <style>
        :root { --accent: #6c5ce7; --bg: #f8f9fa; }
        body { margin: 0; font-family: 'Inter', sans-serif; height: 100vh; display: flex; flex-direction: column; }
        
        header { 
            padding: 10px 20px; background: #2d3436; color: white;
            display: flex; align-items: center; justify-content: space-between;
        }

        .btn-group button {
            padding: 6px 12px; margin-left: 5px; cursor: pointer;
            border-radius: 4px; border: none; background: #636e72; color: white;
        }

        .container { display: flex; flex: 1; width: 100%; overflow: hidden; }
        
        /* Editable Panes */
        .pane { flex: 0 0 50%; padding: 25px; box-sizing: border-box; overflow-y: auto; background: white; }
        .pane-right { flex: 1; background: #fdfdfd; border-left: 1px solid #eee; }
        
        .resizer { width: 8px; cursor: col-resize; background: #dfe6e9; }
        .resizer:hover { background: var(--accent); }

        /* Make content areas editable for the user */
        .content-area { outline: none; min-height: 200px; line-height: 1.6; }
        
        h2 { margin-top: 0; color: var(--accent); }
    </style>
</head>
<body>

<header>
    <strong>Workspace v3.0</strong>
    <div class="btn-group">
        <button onclick="setRatio(60)">3:2</button>
        <button onclick="setRatio(40)">2:3</button>
        <button onclick="downloadContent()" style="background: var(--accent);">&#128190; Download .txt</button>
    </div>
</header>

<div class="container" id="mainContainer">
    <div class="pane pane-left" id="leftPane">
        <h2>Pane A (Master)</h2>
        <div id="textA" class="content-area" contenteditable="true">
            Type your list or master notes here...
        </div>
    </div>
    <div class="resizer" id="dragMe"></div>
    <div class="pane pane-right" id="rightPane">
        <h2>Pane B (Details)</h2>
        <div id="textB" class="content-area" contenteditable="true">
            Type your detailed analysis or preview content here...
        </div>
    </div>
</div>

<script>
    const leftPane = document.getElementById('leftPane');
    const resizer = document.getElementById('dragMe');
    const container = document.getElementById('mainContainer');

    // --- DOWNLOAD LOGIC ---
    function downloadContent() {
        const contentA = document.getElementById('textA').innerText;
        const contentB = document.getElementById('textB').innerText;
        
        const fullText = `WORKSPACE EXPORT\n${'='.repeat(20)}\n\nPANE A CONTENT:\n${contentA}\n\n${'='.repeat(20)}\n\nPANE B CONTENT:\n${contentB}`;
        
        const blob = new Blob([fullText], { type: 'text/plain' });
        const anchor = document.createElement('a');
        anchor.download = 'workspace-export.txt';
        anchor.href = window.URL.createObjectURL(blob);
        anchor.click();
        window.URL.revokeObjectURL(anchor.href);
    }

    // --- RATIO & DRAG LOGIC ---
    function setRatio(p) {
        leftPane.style.flexBasis = p + "%";
    }

    resizer.addEventListener('mousedown', (e) => {
        const startX = e.clientX;
        const startWidth = leftPane.getBoundingClientRect().width;
        const totalWidth = container.offsetWidth;

        const onMove = (e) => {
            let p = ((startWidth + (e.clientX - startX)) / totalWidth) * 100;
            leftPane.style.flexBasis = Math.max(10, Math.min(90, p)) + "%";
        };

        const onUp = () => {
            window.removeEventListener('mousemove', onMove);
            window.removeEventListener('mouseup', onUp);
        };

        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
    });
</script>
</body>
</html>
