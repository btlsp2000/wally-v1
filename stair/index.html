<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WallyCAD - Reverse Loop Gen</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #121212; color: #00ff00; padding: 20px; }
        .box { max-width: 500px; margin: auto; border: 1px dashed #00ff00; padding: 20px; }
        input { background: #000; color: #0f0; border: 1px solid #0f0; width: 50px; margin: 5px; }
        textarea { width: 100%; height: 350px; background: #000; color: #fff; border: 1px solid #444; margin-top: 15px; }
        button { width: 100%; background: #00ff00; color: #000; border: none; padding: 10px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="box">
    <h3>Zigzag & Reverse Loop</h3>
    H (Treads): <input type="number" id="H" value="3">
    a (Rise):   <input type="number" id="a" value="7">
    b (Depth):  <input type="number" id="b" value="11">
    t (Thick):  <input type="number" id="t" value="2">
    
    <button onclick="generate()">Run Counter Pattern</button>
    <textarea id="output" readonly></textarea>
</div>

<script>
    function generate() {
        const H = parseInt(document.getElementById('H').value);
        const a = parseFloat(document.getElementById('a').value);
        const b = parseFloat(document.getElementById('b').value);
        const t = parseFloat(document.getElementById('t').value);
        
        let x = 0, y = 0;
        let pts = [[0, 0]]; // Point 1

        // 1. FORWARD RUN (Outward)
        for (let n = 1; n <= H; n++) {
            x += b;
            pts.push([x, y]); // Horizontal
            let dir = (n % 2 !== 0) ? 1 : -1;
            y += (a * dir);
            pts.push([x, y]); // Vertical
        }

        // 2. TURNAROUND (Point 7 in sketch)
        // Adjust Y by thickness 't' to start the return path
        y -= t;
        pts.push([x, y]);

        // 3. REVERSE LOOP (Inward / Counter Pattern)
        for (let n = H; n >= 1; n--) {
            x -= b;
            pts.push([x, y]); // Horizontal back
            
            // Mirror the vertical toggle
            let dir = (n % 2 !== 0) ? -1 : 1; 
            y += (a * dir);
            
            // Close logic: if we are back at X=0, snap to Y=0
            if (x <= 0) {
                pts.push([0, 0]);
            } else {
                pts.push([x, y]);
            }
        }

        // Output as whitespace delimited tuples
        document.getElementById('output').value = pts.map(p => p.join(' ')).join('\n');
    }
</script>

</body>
</html>
