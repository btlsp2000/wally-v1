<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WallyCAD Manual Folder Layout</title>
    <style>
        :root {
            --line-color: #333;
            --font-stack: 'Courier New', Courier, monospace;
        }
        @page {
            size: letter landscape;
            margin: 0;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #fcfcfc;
            font-family: var(--font-stack);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        /* Outer bounds locked to standard 11x8.5 Letter size */
        .folder-matrix {
            width: 11in;
            height: 8.5in;
            border: 2px dashed #999;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            background: white;
        }
        .quadrant {
            border: 1px solid var(--line-color);
            box-sizing: border-box;
            padding: 0.4in;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }
        /* Top Half inversion for tumble-folding logic */
        .top-half {
            transform: rotate(180deg);
        }
        .text-lines div {
            border-bottom: 1px solid #ccc;
            height: 24px;
            margin-bottom: 8px;
        }
        .box-vector {
            border: 2px solid var(--line-color);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .box-vector::before, .box-vector::after {
            content: ""; position: absolute;
            top: 0; bottom: 0; left: 0; right: 0;
        }
        .box-vector::before { background: linear-gradient(to top right, transparent 49.5%, #ccc 49.5%, #ccc 50.5%, transparent 50.5%); }
        .box-vector::after { background: linear-gradient(to top left, transparent 49.5%, #ccc 49.5%, #ccc 50.5%, transparent 50.5%); }
        
        .url-banner {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            text-align: center;
            border: 2px solid var(--line-color);
            padding: 10px 0;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <div class="folder-matrix">
        <div class="quadrant top-half">
            <div style="font-size: 12px; text-align: right;">Pg ②</div>
            <div class="box-vector" style="height: 1.5in;">
                <span style="position:relative; z-index:2; background:white; padding: 2px 5px;">← SCREEN SHOT OF SEVERAL SETS</span>
            </div>
            <div class="text-lines"><div></div><div></div><div></div></div>
        </div>

        <div class="quadrant top-half">
            <div style="font-size: 12px; text-align: right;">Pg ①</div>
            <div style="text-align: center; font-size: 18px; font-weight: bold; text-decoration: underline;">" MANUAL "</div>
            <div class="text-lines"><div></div><div></div><div></div><div></div></div>
        </div>

        <div class="quadrant">
            <div style="font-size: 12px;">(BACK PAGE)</div>
            <div class="text-lines" style="flex-grow: 1; margin-top: 20px;"><div></div><div></div><div></div><div></div></div>
            <div style="display: flex; justify-content: flex-end;">
                <div class="box-vector" style="width: 0.8in; height: 0.8in; font-size: 10px;"><span style="position:relative; z-index:2;">QR</span></div>
            </div>
        </div>

        <div class="quadrant">
            <div style="font-size: 12px; text-align: right;">(FRT PG)</div>
            <div class="box-vector" style="height: 1.2in;"><span style="position:relative; z-index:2; background:white; padding: 2px 5px;">WALLY CAD</span></div>
            <div class="url-banner">WALLYCAD.COM</div>
            <div class="text-lines" style="height: 0.8in;"><div></div><div></div></div>
            <div style="font-weight: bold; font-size: 14px;">- SEE __________________</div>
        </div>
    </div>

</body>
</html>
