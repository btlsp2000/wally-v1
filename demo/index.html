<!DOCTYPE html>
<html lang="en">
<head>
    <title>WallyCAD | Promotion</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <style>
        body { background-color: #c50; font-family: Arial, sans-serif; margin: 0; display: flex; justify-content: center; }
        .mobile-frame { background-color: #fff; width: 100%; max-width: 480px; min-height: 100vh; position: relative; padding: 20px; box-sizing: border-box; border: 2px solid #333; }
        
        /* Header Match: WallyCAD.com */
        header { text-align: center; border-bottom: 1px solid #ccc; padding-bottom: 10px; margin-bottom: 20px; }
        h1 { font-size: 28px; margin: 0; color: #333; }

        /* Demo Area: The "X" Box */

        .demo-box::after { content: "DEMO / VIDEO"; font-weight: bold; color: #999; }
        
        /* Content Grid */
        .content-footer { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 40px; }
        .text-block { width: 60%; border-top: 2px solid #333; padding-top: 10px; }
        .qr-code { width: 60px; height: 60px; border: 2px solid #333; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }

        .btn { background-color: #FEFF8C; border: 1px solid #333; padding: 15px; display: block; text-align: center; text-decoration: none; color: #000; font-weight: bold; border-radius: 8px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="mobile-frame">
    <header>
        <p style="font-size: 12px; margin: 0;">WALLYCAD.COM</p>
        <h1>WallyCAD</h1>
    </header>

    <div class="demo-box">
        </div>

    <p><em>"Adapting Wally to CofP"</em></p>

    <a href="https://gumroad.com/l/WallyCAD" class="btn">DOWNLOAD WALLYCAD</a>

    <div class="content-footer">
        <div class="text-block">
            <p style="margin:0; font-size: 14px;">Release 04.01.26<br>LastKnownAddress</p>
        </div>
        <div class="qr-code">QR</div>
    </div>
</div>

</body>
</html>
