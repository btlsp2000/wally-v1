<!DOCTYPE html><html lang="en"><head>    <meta charset="UTF-8">    <title>WALLY V1.0.14 | BOX PROTOCOL</title>    <script src="https://unpkg.com/jspdf@latest/dist/jspdf.umd.min.js"></script>    <style>        :root { --bg: #222; --cad-bg: #121212; --accent: #61afef; --text: #eee; --sel: #98c379; }        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Consolas', monospace; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }        #toolbar { height: 40px; background: #2c2c2c; border-bottom: 1px solid #444; display: flex; align-items: center; padding: 0 10px; gap: 5px; }        #workspace { flex-grow: 1; display: flex; position: relative; overflow: hidden; }        #sidebar { width: 280px; background: #252526; border-right: 1px solid #444; display: flex; flex-direction: column; overflow-y: auto; }        #canvas-area { flex-grow: 1; position: relative; background: var(--cad-bg); cursor: crosshair; }        button { background: #444; border: 1px solid #555; color: #ddd; padding: 4px 8px; font-size: 11px; cursor: pointer; }        button:hover { border-color: var(--accent); }        .panel { padding: 10px; border-bottom: 1px solid #333; }        .panel-title { font-size: 11px; font-weight: bold; color: var(--accent); margin-bottom: 8px; text-transform: uppercase; }        textarea { background: #111; border: 1px solid #444; color: var(--accent); padding: 8px; font-family: inherit; font-size: 12px; width: 100%; height: 350px; box-sizing: border-box; line-height: 1.5; }        #nice-title { position: fixed; background: #1e1e1e; color: var(--accent); border: 1px solid #444; padding: 5px 8px; font-size: 11px; pointer-events: none; z-index: 10000; }    </style></head><body>
    <div id="toolbar">        <span style="font-weight:bold; color:var(--accent); margin-right:10px;">WALLY v1.0.14</span>        <button onclick="fileNew()">NEW</button>        <button onclick="fileSave()">SAVE</button>        <button onclick="fileLoad()">LOAD</button>        <span style="width:1px; height:20px; background:#444; margin:0 5px;"></span>        <button onclick="exec('WALL')">WALL</button>        <button onclick="exec('RECT')">BOX (RECT)</button>        <button onclick="exec('CIRCLE')">CIRCLE</button>        <button onclick="centerView()">ZOOM E</button>        <span style="flex-grow:1;"></span>        <button onclick="exportJSON()" style="color:var(--sel);">EXPORT .WALLY</button>    </div>
    <div id="workspace">        <div id="sidebar">            <div class="panel">                <div class="panel-title">PROPERTIES</div>                <div style="display:flex; gap:5px; margin-bottom:10px;">                    <span style="font-size:10px; color:#888;">Type</span>                    <select id="prop-type" onchange="updateProp()"><option value="RECT">Box (Rect)</option><option value="WALL">Wall</option><option value="LINE">Line</option></select>                </div>                <div style="font-size:10px; color:#888; margin-bottom:4px;">DATA (W, H, X, Y):</div>                <textarea id="prop-geo" oninput="updateProp()" placeholder="Example:&#10;24 12 25.8 0&#10;9 12 16.8 0"></textarea>            </div>            <div id="ent-list" style="overflow-y:auto; flex-grow:1;"></div>        </div>        <div id="canvas-area"><canvas id="canvas"></canvas></div>    </div>
<script>
let state = { ents: [], view: { x: 50, y: 50, scale: 3 }, selection: null };
class M { constructor(x,y){this.x=x;this.y=y} }

function parseBlocks(ent) {
    const blocks = [];
    ent.geo.split('\n').forEach(line => {
        const p = line.trim().replace(/,/g, ' ').split(/\s+/).filter(v => v !== "");
        if (p.length >= 4 && ent.type === 'RECT') { 
            // Layout: W, H, X, Y
            let w=parseFloat(p[0]), h=parseFloat(p[1]), x=parseFloat(p[2]), y=parseFloat(p[3]);
            if(!isNaN(w)) blocks.push([new M(x,y), new M(x+w,y), new M(x+w,y+h), new M(x,y+h), new M(x,y)]);
        } else if (p.length >= 2) {
            let x=parseFloat(p[0]), y=parseFloat(p[1]);
            if (!isNaN(x)) blocks.push([new M(x,y)]); // Placeholder for Wall/Line logic
        }
    });
    return blocks;
}

window.onload=()=>{ resize(); window.addEventListener('resize', resize); centerView(); };
function exec(c){ if(c==='WALL')createEnt('WALL',"0 0\n20 0"); else if(c==='RECT')createEnt('RECT',"24 12 25.8 0"); draw(); }
function draw(){
    const cvs=document.getElementById('canvas'); const ctx=cvs.getContext('2d'); ctx.fillStyle='#121212'; ctx.fillRect(0,0,cvs.width,cvs.height);
    ctx.save(); ctx.translate(state.view.x, cvs.height - state.view.y); ctx.scale(state.view.scale,-state.view.scale);
    state.ents.forEach(ent=>{
        ctx.strokeStyle=state.selection===ent?'#98c379':'#fff'; ctx.lineWidth=1/state.view.scale;
        const blocks = parseBlocks(ent);
        blocks.forEach(pts => {
            ctx.beginPath(); pts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y)); ctx.stroke();
        });
    });
    ctx.restore();
}
function resize(){ const c=document.getElementById('canvas'),p=document.getElementById('canvas-area'); c.width=p.clientWidth; c.height=p.clientHeight; draw(); }
function createEnt(type,geo){ const ent={id:Date.now(),type,geo}; state.ents.push(ent); state.selection=ent; renderList(); draw(); }
function updateProp(){ if(!state.selection)return; state.selection.type=document.getElementById('prop-type').value; state.selection.geo=document.getElementById('prop-geo').value; draw(); }
function renderList(){ const l=document.getElementById('ent-list'); l.innerHTML=''; state.ents.forEach(e=>{ const r=document.createElement('div'); r.style.padding='8px'; r.style.fontSize='11px'; r.style.borderBottom='1px solid #333'; r.style.background=state.selection===e?'#2a2a2a':'transparent'; r.innerText=e.type; r.onclick=()=>{state.selection=e; document.getElementById('prop-type').value=e.type; document.getElementById('prop-geo').value=e.geo; renderList(); draw();}; l.appendChild(r); }); }
function centerView(){ state.view.x=50; state.view.y=50; state.view.scale=4; draw(); }
function exportJSON(){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(state.ents)],{type:'application/json'})); a.download='cabin_v14.wally'; a.click(); }
</script></body></html>
