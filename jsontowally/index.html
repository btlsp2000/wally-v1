<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WallyCAD | Data Converter</title>
    <style>
        body { background: #1a1a1a; color: #00ff00; font-family: monospace; padding: 20px; }
        textarea { width: 100%; height: 200px; background: #000; color: #00ff00; border: 1px solid #444; padding: 10px; margin-bottom: 10px; }
        button { background: #00ff00; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
        button:hover { background: #00cc00; }
        .label { margin-bottom: 5px; display: block; color: #fff; }
    </style>
</head>
<body>

    <h2>WALLY DATA CONVERTER</h2>
    
    <span class="label">INPUT: Standard JSON (e.g. [{lat: 45, lng: -122}, ...])</span>
    <textarea id="jsonInput" placeholder='[{"lat": 45.5, "lng": -122.6}, {"lat": 45.6, "lng": -122.7}]'></textarea>
    
    <button onclick="convertToWally()">CONVERT TO SDJ STRING</button>
    <br><br>

    <span class="label">OUTPUT: Wally Space-Delimited String (Ready for Gist)</span>
    <textarea id="wallyOutput" readonly></textarea>

    <script>
        function convertToWally() {
            const input = document.getElementById('jsonInput').value;
            const output = document.getElementById('wallyOutput');
            
            try {
                const data = JSON.parse(input);
                
                // Maps JSON objects to "Lat Long Lat Long" format
                // Precision set to 4 decimal places for CNC accuracy
                const sdjString = data.map(point => {
                    // Handles various key names (lat/latitude, lng/long/longitude)
                    const lat = point.lat || point.latitude;
                    const lng = point.lng || point.long || point.longitude;
                    return `${lat.toFixed(4)} ${lng.toFixed(4)}`;
                }).join(' ');

                output.value = sdjString;
                
                // Copy to clipboard automatically for Gist updates
                navigator.clipboard.writeText(sdjString);
                console.log("Conversion complete and copied to clipboard.");
                
            } catch (e) {
                alert("Error parsing JSON. Check your syntax (brackets/commas).");
            }
        }
    </script>
</body>
</html>
