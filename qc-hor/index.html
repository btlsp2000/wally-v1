<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickClick Horizontal</title>
    <style>
        /* The Flexbox Container from your sketch */
        .qc-horizontal {
            display: flex;
            flex-direction: row;
            width: 100%;
            height: 300px; /* Adjust height as needed for WallyCAD */
            gap: 20px;
            padding: 15px;
            box-sizing: border-box;
            background-color: #f0f0f0;
        }

        /* Keyboard: Fixed width so buttons don't warp */
        .keyboard {
            flex: 0 0 400px; 
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 8px;
            border: 2px solid #333;
            padding: 10px;
            background: #fff;
        }

        /* TextArea Container: Set to expand */
        .text-area-container {
            flex: 1; /* This is what makes it 'Expand' to fill the rest of the row */
            display: flex;
        }

        #qc-output {
            width: 100%;
            height: 100%;
            padding: 15px;
            font-size: 1.2rem;
            border: 2px solid #333;
            resize: none; /* Prevents user from breaking the layout */
        }

        /* Quick button styling */
        button {
            cursor: pointer;
            font-weight: bold;
            background: #e0e0e0;
            border: 1px solid #999;
        }
        button:active {
            background: #ccc;
        }

        .qc-horizontal {
    display: flex;
    flex-direction: row;
    width: 100%;
    height: 100vh; /* Takes full viewport height */
    gap: 10px;
    background: #222; /* Matches a typical dark CAD theme */
}

.keyboard-container {
    /* Set the base width for the QC interface */
    flex: 0 0 500px; 
    border-right: 2px solid #444;
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
    overflow: hidden;
}

.text-area-container {
    flex: 1; /* This remains the expanding element */
    display: flex;
    padding: 10px;
}

#qc-output {
    flex: 1;
    background: #1e1e1e;
    color: #00ff00; /* Classic CAD 'Green' text */
    font-family: 'Consolas', monospace;
    border: 1px solid #444;
    padding: 15px;
    resize: none;
}
    </style>
</head>
<body>

    <div class="qc-horizontal">
        
        <!-- KEYBOARD SECTION 
        <section class="keyboard">
            <button>7</button><button>8</button><button>9</button><button>/</button>
            <button>4</button><button>5</button><button>6</button><button>*</button>
            <button>1</button><button>2</button><button>3</button><button>-</button>
            <button>0</button><button>.</button><button>CLR</button><button>+</button>
        </section>-->

        <div class="qc-horizontal">
    
    <section class="keyboard-container">
        <iframe src="https://wallycad.com/qc" title="QuickClick Interface"></iframe>
    </section>

    <section class="text-area-container">
        <textarea id="qc-output" placeholder="Output area..."></textarea>
    </section>

</div>

        <!-- TEXTAREA SECTION -->
        <section class="text-area-container">
            <textarea id="qc-output" placeholder="Output area..."></textarea>
        </section>

    </div>

</body>
</html>
