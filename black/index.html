<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WALLY V1.0.10 | CLEAN WHITE PLOT</title>
    <script src="https://unpkg.com/jspdf@latest/dist/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg: #222;
            --cad-bg: #ffffff; /* Clean white paper */
            --cmd-bg: #333;
            --accent: #61afef;
            --text: #eee;
            --dim: #888;
            --sel: #98c379;
            --print: #e5c07b;
        }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Consolas', monospace; display: flex; flex-direction: column; height: 100vh; overflow: hidden; user-select: none; }
        #toolbar { height: 40px; background: #2c2c2c; border-bottom: 1px solid #444; display: flex; align-items: center; padding: 0 10px; gap: 5px; flex-shrink: 0; z-index: 1000; position: relative; }
        .menu-btn { cursor: pointer; color: var(--accent); font-size: 20px; font-weight: bold; padding: 0 5px; z-index: 9999; }
        #workspace { flex-grow: 1; display: flex; position: relative; overflow: hidden; }
        #sidebar { width: 260px; background: #252526; border-right: 1px solid #444; display: flex; flex-direction: column; z-index: 2; overflow-y: auto; }
        #canvas-area { flex-grow: 1; position: relative; background: var(--cad-bg); cursor: crosshair; }
        #cmd-bar { height: 30px; background: var(--cmd-bg); border-top: 1px solid #555; display: flex; align-items: center; padding: 0 5px; font-size: 12px; flex-shrink: 0; }
        button { background: #444; border: 1px solid #555; color: #ddd; padding: 4px 8px; font-family: inherit; font-size: 11px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #555; border-color: var(--accent); }
        .panel { padding: 10px; border-bottom: 1px solid #333; }
        .panel-title { font-size: 11px; font-weight: bold; color: var(--accent); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        input, select, textarea { background: #111; border: 1px solid #444; color: var(--accent); padding: 4px; font-family: inherit; font-size: 11px; width: 100%; box-sizing: border-box; }
        #cmd-input { border: none; background: transparent; color: white; font-size: 12px; flex-grow: 1; outline: none; }
        .list-row { display: flex; justify-content: space-between; align-items: center; padding: 4px; font-size: 11px; cursor: pointer; border-bottom: 1px solid #333; }
        .list-row:hover { background: #333; }
        .list-row.selected { border-left: 3px solid var(--sel); background: #2a2a2a; }
        .overlay-bg { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center; }
        .overlay-content { background: #1e1e1e; width: 85%; max-width: 800px; height: 85%; overflow-y: auto; padding: 40px; border: 1px solid var(--accent); position: relative; }
        #nice-title { position: fixed; background: #1e1e1e; color: var(--accent); border: 1px solid #444; padding: 5px 8px; font-family: 'Consolas', monospace; font-size: 11px; pointer-events: none; z-index: 10000; display: none; }
        body.hal-mode #sidebar, body.hal-mode #toolbar, body.hal-mode #cmd-bar { display: none; }
        body.hal-mode #canvas-area { width: 100vw; height: 100vh; background: black; }
        #hal-exit { display: none; position: absolute; top: 20px; right: 20px; z-index: 100; background: red; color: white; border-radius: 50%; width: 40px; height: 40px; text-align: center; line-height: 40px; cursor: pointer; }
        body.hal-mode #hal-exit { display: block; }
    </style>
</head>
<body>
    <div id="toolbar">
        <div class="menu-btn" onclick="toggleLibrary()">☰</div>
        <span style="font-weight:bold; color:var(--accent); margin-right:10px;">WALLY v1.0.10</span>
        <button onclick="fileNew()">NEW</button>
        <button onclick="fileSave()">SAVE</button>
        <button onclick="fileLoad()">LOAD</button>
        <span style="width:1px; height:20px; background:#444; margin:0 5px;"></span>
        <button onclick="exec('WALL')">WALL</button>
        <button onclick="exec('CIRCLE')">CIRCLE</button>
        <button onclick="exec('STAIR')">STAIR</button>
        <button onclick="exec('DIM')">DIM</button>
        <button onclick="exec('TEXT')">TEXT</button>
        <span style="flex-grow:1;"></span>
        <button onclick="autoFitScale()">AUTO FIT</button>
        <button onclick="exportPDF()" style="background:var(--print); color:#111; font-weight:bold;">PDF PLOT</button>
    </div>

    <div id="workspace">
        <div id="sidebar">
            <div class="panel">
                <div class="panel-title">PLOT SETTINGS</div>
                <div class="control-row">
                    <select id="paperSize"><option value="LETTER">Letter</option><option value="TABLOID">Tabloid</option></select>
                    <select id="paperOrient"><option value="L">L</option><option value="P">P</option></select>
                </div>
                <div class="control-row"><input type="text" id="printScale" value="1/4&quot; = 1'-0&quot;"></div>
                <div class="control-row"><select id="unitMap"><option value="IN">Inches</option><option value="FT">Feet</option><option value="MM">MM</option></select></div>
            </div>
            <div class="panel">
                <div class="panel-title">PROPERTIES</div>
                <div class="control-row"><select id="prop-type" onchange="updateProp()"><option value="WALL">Wall</option><option value="LINE">Line</option><option value="CIRCLE">Circle</option><option value="DIM">Dim</option><option value="TEXT">Text</option><option value="STAIR">Stair</option></select></div>
                <div class="control-row"><select id="prop-layer" onchange="updateProp()"></select></div>
                <div class="control-row">W/R <input id="prop-thick" type="number" step="0.1" oninput="updateProp()"></div>
                <div class="control-row">D/T <input id="prop-thickEnd" type="number" step="0.1" oninput="updateProp()"></div>
                <div class="control-row">Text <input id="prop-textStr" type="text" oninput="updateProp()"></div>
                <textarea id="prop-geo" style="height:80px; margin-top:5px;" oninput="updateProp()"></textarea>
            </div>
            <div class="panel" style="flex-grow:1; display:flex; flex-direction:column;">
                <div class="panel-title">ENTITIES</div>
                <div id="ent-list" style="overflow-y:auto; flex-grow:1;"></div>
            </div>
        </div>
        <div id="canvas-area">
            <canvas id="canvas"></canvas>
            <div id="hal-exit" onclick="exec('HAL')">X</div>
        </div>
    </div>

    <div id="cmd-bar">
        <span id="cmd-prompt">COMMAND:</span>
        <input id="cmd-input" type="text" autocomplete="off" placeholder="Type command...">
        <span id="cmd-history" style="color:#666; margin-left:10px;"></span>
    </div>

    <input type="file" id="file-input" style="display:none" onchange="handleFile(this)">

    <script>
        let state = {
            ents: [],
            layers: { '0': { color: '#000000', visible: true }, 'WALLS': { color: '#000000', visible: true }, 'DIMS': { color: '#000000', visible: true } },
            currentLayer: '0',
            selection: null,
            view: { x: 0, y: 0, scale: 5, panStart: null },
            mouse: { x: 0, y: 0, worldX: 0, worldY: 0 },
            osnap: null
        };

        class M {
            constructor(x,y){this.x=x;this.y=y}
            add(v){return new M(this.x+v.x,this.y+v.y)}
            sub(v){return new M(this.x-v.x,this.y-v.y)}
            mul(s){return new M(this.x*s,this.y*s)}
            div(s){return new M(this.x/s,this.y/s)}
            cross(v){return (this.x*v.y)-(this.y*v.x)}
            dot(v){return (this.x*v.x)+(this.y*v.y)}
            mag(){return Math.sqrt(this.x**2+this.y**2)}
            norm(){const m=this.mag();return m===0?new M(0,0):this.div(m)}
            perp(){return new M(-this.y,this.x)}
        }

        function VIA(P1,v1,P2,v2,th){
            const det=v1.cross(v2);
            if(Math.abs(det)<1e-9)return null;
            const t=(P2.sub(P1).x*v2.y - P2.sub(P1).y*v2.x)/det;
            const I=P1.add(v1.mul(t));
            const mv=v1.mul(-1).add(v2).norm();
            const d = v1.mul(-1).dot(mv);
            const sq = Math.max(0, 1 - d*d);
            const sm = sq === 0 ? 0 : (th/2)/Math.sqrt(sq);
            return {I, In:I.add(mv.mul(sm)), Out:I.sub(mv.mul(sm)), Turn:det>0?'L':'R'};
        }

        function parseCoords(txt) {
            const pts=[];
            txt.replace(/[\t\n\r,]+/g,' ').replace(/\s+/g,' ').trim().split(' ').forEach((v,i,a)=>{
                if(i%2===0 && a[i+1]){
                    let x=parseFloat(v), y=parseFloat(a[i+1]);
                    if(!isNaN(x)&&!isNaN(y)) pts.push(new M(x,y));
                }
            });
            return pts;
        }

        function ComputeGeometry(txt, th) {
            const ptsM = parseCoords(txt);
            if(ptsM.length<2) return null;
            const N=ptsM.length;
            const j=[];
            const cl=ptsM[0].sub(ptsM[N-1]).mag()<1e-4;
            for(let i=0;i<N;i++){
                let pp=i===0?null:ptsM[i-1], pn=i===N-1?null:ptsM[i+1], vin, vout, res;
                if(cl){ pp=ptsM[(i-1+N)%N]; pn=ptsM[(i+1)%N]; }
                if(pp) vin=ptsM[i].sub(pp).norm();
                if(pn) vout=pn.sub(ptsM[i]).norm();
                if(pp&&pn){
                    const v=VIA(pp,vin,ptsM[i],vout,th);
                    if(v) res=v.Turn==='L'?{L:v.In,R:v.Out}:{L:v.Out,R:v.In};
                    else{const p=vin.perp(); res={L:ptsM[i].add(p.mul(th/2)),R:ptsM[i].sub(p.mul(th/2))}}
                }
                else if(!pp){const p=vout.perp(); res={L:ptsM[i].add(p.mul(th/2)),R:ptsM[i].sub(p.mul(th/2))}}
                else{const p=vin.perp(); res={L:ptsM[i].add(p.mul(th/2)),R:ptsM[i].sub(p.mul(th/2))}}
                j.push(res);
            }
            return {points:ptsM, joints:j, isClosed:cl};
        }

        function draw() {
            const cvs = document.getElementById('canvas');
            const ctx = cvs.getContext('2d');
            
            // BACKGROUND: White for Paper, Black for HAL
            ctx.fillStyle = document.body.classList.contains('hal-mode') ? 'black' : '#ffffff';
            ctx.fillRect(0, 0, cvs.width, cvs.height);

            // GRID IS REMOVED

            ctx.save();
            ctx.translate(state.view.x, state.view.y);
            ctx.scale(state.view.scale, -state.view.scale);

            state.ents.forEach(ent => {
                const lay = state.layers[ent.layer] || state.layers['0'];
                if (!lay.visible) return;

                const isSel = state.selection === ent;
                // FORCE BLACK (#000) except when selected or in HAL mode
                const col = isSel ? '#98c379' : (document.body.classList.contains('hal-mode') ? '#ffffff' : '#000000');
                
                const pts = parseCoords(ent.geo);
                if(pts.length===0) return;

                ctx.strokeStyle = col;
                ctx.lineWidth = (isSel ? 2 : 1.2) / state.view.scale;

                if (ent.type === 'CIRCLE') {
                    const c = pts[0], r = ent.thick || 1, w = ent.thickEnd || 0;
                    ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, Math.PI*2); ctx.stroke();
                    if (w > 0) {
                        ctx.beginPath(); ctx.arc(c.x, c.y, r + w/2, 0, Math.PI*2); ctx.stroke();
                        ctx.beginPath(); ctx.arc(c.x, c.y, Math.max(0.001, r - w/2), 0, Math.PI*2); ctx.stroke();
                    }
                    return;
                }

                if (ent.type === 'TEXT') {
                    ctx.save(); ctx.translate(pts[0].x, pts[0].y); ctx.scale(1, -1);
                    ctx.fillStyle = col; ctx.font = `bold ${ent.thick}px sans-serif`;
                    ctx.fillText(ent.textStr || "TEXT", 0, 0); ctx.restore();
                    return;
                }

                if (ent.type === 'DIM' && pts.length >= 2) {
                    const p1 = pts[0], p2 = pts[1], dx = p2.x-p1.x, dy = p2.y-p1.y, len = Math.hypot(dx, dy);
                    const nx = -dy/len, ny = dx/len, off = ent.thick;
                    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p1.x+nx*off, p1.y+ny*off);
                    ctx.lineTo(p2.x+nx*off, p2.y+ny*off); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                    return;
                }

                const geo = ComputeGeometry(ent.geo, ent.thick);
                if(!geo) return;
                if (ent.thick > 0 && ent.type !== 'LINE') {
                    const dp=(a)=>{ctx.beginPath(); a.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y)); if(geo.isClosed)ctx.closePath(); ctx.stroke();}
                    dp(geo.joints.map(j=>j.L)); dp(geo.joints.map(j=>j.R));
                } else {
                    ctx.beginPath(); geo.points.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y)); if(geo.isClosed)ctx.closePath(); ctx.stroke();
                }
            });

            if(state.osnap) {
                ctx.strokeStyle = '#ff0000'; // Red snap for white background
                ctx.lineWidth = 2 / state.view.scale;
                const s = 10 / state.view.scale;
                ctx.strokeRect(state.osnap.x-s/2, state.osnap.y-s/2, s, s);
            }
            ctx.restore();
        }

        // ==========================================
        // UI & EVENT WRAPPERS
        // ==========================================
        window.onload = () => { resize(); window.addEventListener('resize', resize);
            const cvs = document.getElementById('canvas');
            cvs.addEventListener('mousedown', onDown); window.addEventListener('mousemove', onMove);
            cvs.addEventListener('mouseup', () => state.view.panStart = null);
            cvs.addEventListener('wheel', e => { state.view.scale *= e.deltaY<0 ? 1.1 : 0.9; draw(); });
            document.getElementById('cmd-input').addEventListener('keydown', e => { if(e.key === 'Enter') { exec(e.target.value); e.target.value=''; }});
            renderLayers(); draw();
        };

        function onDown(e) { if(e.button===2||e.altKey) state.view.panStart={x:e.clientX, y:e.clientY, vx:state.view.x, vy:state.view.y}; else if(e.button===0) selectEnt(findHit()); }
        function onMove(e) { 
            const r = document.getElementById('canvas').getBoundingClientRect();
            if(state.view.panStart) { state.view.x=state.view.panStart.vx+(e.clientX-state.view.panStart.x); state.view.y=state.view.panStart.vy+(e.clientY-state.view.panStart.y); draw(); return; }
            state.mouse.worldX = ((e.clientX-r.left)-state.view.x)/state.view.scale;
            state.mouse.worldY = -((e.clientY-r.top)-state.view.y)/state.view.scale;
            draw();
        }
        function findHit() { 
            const t = 10/state.view.scale;
            return state.ents.find(e => parseCoords(e.geo).some(p => Math.abs(p.x-state.mouse.worldX)<t && Math.abs(p.y-state.mouse.worldY)<t));
        }
        function resize() { const c=document.getElementById('canvas'); const a=document.getElementById('canvas-area'); c.width=a.clientWidth; c.height=a.clientHeight; draw(); }
        function exec(cmd) { 
            const op = cmd.toUpperCase();
            if(op==='WALL') createEnt('WALL', 'WALLS', "0,0\n20,0", 5);
            if(op==='CIRCLE') createEnt('CIRCLE', '0', "0,0", 5);
            if(op==='HAL') { document.body.classList.toggle('hal-mode'); resize(); }
            draw();
        }
        function createEnt(type, layer, geo, thick) { const ent={type, layer, geo, thick}; state.ents.push(ent); selectEnt(ent); return ent; }
        function selectEnt(ent) { state.selection=ent; if(ent) { document.getElementById('prop-geo').value=ent.geo; document.getElementById('prop-thick').value=ent.thick; } renderList(); draw(); }
        function updateProp() { if(!state.selection) return; state.selection.thick=parseFloat(document.getElementById('prop-thick').value); state.selection.geo=document.getElementById('prop-geo').value; draw(); }
        function renderLayers() { const sel=document.getElementById('prop-layer'); sel.innerHTML='<option value="0">Layer 0</option><option value="WALLS">Walls</option>'; }
        function renderList() { const l=document.getElementById('ent-list'); l.innerHTML=''; state.ents.forEach(e => { const r=document.createElement('div'); r.className='list-row'+(state.selection===e?' selected':''); r.innerText=e.type; r.onclick=()=>selectEnt(e); l.appendChild(r); }); }
        function fileNew() { state.ents=[]; selectEnt(null); draw(); }
        function exportPDF() { alert("Use Print Scale and PDF Plot for final output."); }
    </script>
</body>
</html>
