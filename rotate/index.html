<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #1a1a1a; color: #e0e0e0; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        canvas { border: 1px solid #444; background: #000; margin: 20px; box-shadow: 0 0 15px rgba(0,255,204,0.2); }
        textarea { width: 450px; height: 50px; background: #222; color: #0f0; border: 1px solid #444; padding: 10px; margin-bottom: 10px; border-radius: 4px; }
        .output-box { width: 450px; background: #222; border-left: 4px solid #00ffcc; padding: 15px; margin-top: 10px; color: #00ffcc; font-size: 0.9em; white-space: pre-wrap; }
        input[type="range"] { width: 450px; cursor: pointer; }
        h2 { color: #00ffcc; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h2>WallyCAD 2D Rotation Engine</h2>
    
    <label>Input Points (x,y; x,y...):</label>
    <textarea id="pointsInput">60,-20; -80,-50; -50,70; 40,80</textarea>
    
    <input type="range" id="gamma" min="0" max="360" value="45">
    <p>Angle γ: <span id="angleDisplay">45</span>°</p>

    <canvas id="cvs" width="400" height="400"></canvas>

    <div id="textOutput" class="output-box">Rotated Points: (calculating...)</div>

<script>
    const canvas = document.getElementById('cvs');
    const ctx = canvas.getContext('2d');
    const input = document.getElementById('pointsInput');
    const slider = document.getElementById('gamma');
    const display = document.getElementById('angleDisplay');
    const textOutput = document.getElementById('textOutput');

    function process() {
        // 1. Parse Input
        const raw = input.value.split(';').map(pair => pair.split(',').map(Number));
        const gamma = parseFloat(slider.value);
        display.innerText = gamma;

        // 2. Math Setup
        const rad = (Math.PI / 180) * gamma;
        const cos = Math.cos(rad);
        const sin = Math.sin(rad);

        // 3. Transform & Format Text
        const rotated = raw.map(([x, y]) => {
            const nx = x * cos - y * sin;
            const ny = x * sin + y * cos;
            return [nx.toFixed(2), ny.toFixed(2)];
        });

        // Update Text Display
        const tupleString = rotated.map(pt => `(${pt[0]}, ${pt[1]})`).join(", ");
        textOutput.innerText = `ROTATED SET (γ=${gamma}°):\n${tupleString}`;

        // 4. Render Visuals
        ctx.clearRect(0,0,400,400);
        ctx.save();
        ctx.translate(200, 200); 
        ctx.scale(1, -1); // Maintain Cartesian Y-up

        ctx.strokeStyle = '#00ffcc';
        ctx.lineWidth = 2;
        ctx.beginPath();
        rotated.forEach((pt, i) => {
            if (i === 0) ctx.moveTo(pt[0], pt[1]);
            else ctx.lineTo(pt[0], pt[1]);
        });
        ctx.closePath();
        ctx.stroke();
        
        ctx.restore();
    }

    [slider, input].forEach(el => el.addEventListener('input', process));
    process();
</script>
</body>
</html>
